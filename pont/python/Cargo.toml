[package]
name = "nearfield-pont-py"
version = "0.1.0"
edition = "2021"
description = "Liaison Python du protocole de confiance v2 de nearfield."
license = "MIT"
publish = false

[lib]
# Nom du module Python : `import nearfield_pont`.
name = "nearfield_pont"
crate-type = ["cdylib"]

[dependencies]
pont = { package = "nearfield-pont", path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = "1"
