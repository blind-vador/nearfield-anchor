[package]
name = "nearfield-pont"
version = "0.1.0"
edition = "2021"
description = "Protocole de confiance v2 de nearfield : clés, objets signés, appairage, certificats, transport Noise."
license = "MIT"
publish = false
exclude = ["python"]

[lib]
name = "nearfield_pont"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
data-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
snow = "0.9"

[dev-dependencies]
tempfile = "3"
