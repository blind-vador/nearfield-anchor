# Partages NAS (nearfield anchor, nas/smb.conf).
# Disques montes par nas_watch.py (par UUID, sans fstab).
[global]
   workgroup = WORKGROUP
   server string = @HOSTNAME@
   server role = standalone server
   map to guest = never
   # Securite (lot 0 de Prismaforge, 2026-11-15) : SMB3 chiffre obligatoire,
   # NetBIOS (port 139) coupe. macOS, Windows 10 et 11 le savent tous.
   server min protocol = SMB3
   server smb encrypt = required
   disable netbios = yes
   smb ports = 445
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   # Compatibilite macOS (Finder) : metadonnees, noms de fichiers, verrous.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   # Annonce aux Mac du reseau (Bonjour / mDNS).
   multicast dns register = yes

[server]
   comment = Petit disque : systeme, serveur, depot git (nd1)
   path = /media/nas/nd1
   valid users = @RUN_USER@
   force user = @RUN_USER@
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

[stockage]
   comment = Gros disque de stockage partage (nd2)
   path = /media/nas/nd2
   valid users = @RUN_USER@
   force user = @RUN_USER@
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
