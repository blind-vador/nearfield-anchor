# Sortie son par defaut : adaptateur USB "Device" (2026-09-29), via son
# mixeur dmix pour que plusieurs sons puissent jouer en meme temps (console +
# scanner + veilles). Le jack integre du Pi (snd_bcm2835) faisait planter son
# pilote (erreurs VCHI puis blocage complet du son).
pcm.!default {
    type plug
    slave.pcm "dmix:CARD=Device,DEV=0"
}
ctl.!default {
    type hw
    card Device
}

# Capture de ce qui sort (commande "capture", 2026-10-19) : voir lib/capture_son.py.
pcm.boucle_mix {
    type dmix
    ipc_key 5978
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
# Pendant une capture seulement (lib/capture_son.py) : la boucle est lue a
# la fois par le relais vers la carte USB (alsaloop) et par l'enregistrement.
pcm.boucle_ecoute {
    type dsnoop
    ipc_key 5979
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

# Fichier present seulement pendant une capture : il redirige la sortie par
# defaut vers la boucle (en dernier : il l'emporte sur la definition du haut).
@hooks [
    {
        func load
        files [ "/run/user/1000/capture_alsa.conf" ]
        errors false
    }
]
