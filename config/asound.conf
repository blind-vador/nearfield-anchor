# Sortie son par defaut : adaptateur USB "Device" (2026-09-29), via son
# mixeur dmix pour que plusieurs sons puissent jouer en meme temps (console +
# scanner + veilles). Le jack integre du Pi (snd_bcm2835) faisait planter son
# pilote (erreurs VCHI puis blocage complet du son).
pcm.!default {
    type plug
    slave.pcm "sortie_double"   # carte USB + boucle de capture (voir plus bas)
}
ctl.!default {
    type hw
    card Device
}

# Capture de ce qui sort (commande "capture", 2026-10-19) : chaque son va a
# la fois a la carte USB et a une carte "boucle" (snd-aloop) que la capture
# enregistre. Les deux dmix sont partages par tous les programmes.
pcm.boucle_mix {
    type dmix
    ipc_key 5978
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
pcm.sortie_carte_et_boucle {
    type multi
    slaves.a.pcm "dmix:CARD=Device,DEV=0"
    slaves.a.channels 2
    slaves.b.pcm "boucle_mix"
    slaves.b.channels 2
    bindings.0 { slave a; channel 0; }
    bindings.1 { slave a; channel 1; }
    bindings.2 { slave b; channel 0; }
    bindings.3 { slave b; channel 1; }
}
pcm.sortie_double {
    type route
    slave.pcm "sortie_carte_et_boucle"
    slave.channels 4
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}
pcm.sortie_capturee {
    type plug
    slave.pcm "sortie_double"
}
