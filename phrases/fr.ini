contexte = consigne questionnaire

[imprimante.q_consigne]
texte = {n} possibles. Flèches pour changer, Entrée pour valider, F1 pour l'aide.
contexte = rappel court

[imprimante.q_suivant]
texte = Suivant.
contexte = entre deux questions

[imprimante.q_couche_titre]
texte = Épaisseur de chaque couche.
contexte = question 1

[imprimante.q_couche_aide]
texte = L'imprimante construit l'objet en superposant de fines couches de plastique, comme des feuilles empilées. Une couche plus épaisse va plus vite mais les détails et les courbes sont moins nets au toucher. Une couche plus fine prend plus de temps, mais la surface est plus douce et les petits détails se sentent mieux. Rapide : environ 28 centièmes de millimètre. Normale : 20. Fine : 12.
contexte = F1 couche

[imprimante.param_couche_rapide]
texte = Rapide : couches plus épaisses, impression plus courte, moins de détail.
contexte = choix

[imprimante.param_couche_normale]
texte = Normale : bon compromis entre temps et détail. Recommandé pour commencer.
contexte = choix

[imprimante.param_couche_fine]
texte = Fine : couches minces, plus de détail, impression plus longue.
contexte = choix

[imprimante.q_remplissage_titre]
texte = Quantité de matière à l'intérieur de l'objet.
contexte = question 2

[imprimante.q_remplissage_aide]
texte = L'extérieur de l'objet est toujours une coque pleine. L'intérieur peut être plus ou moins rempli, comme une éponge plus ou moins dense. Léger : peu de matière dedans, objet plus léger et plus rapide à imprimer, mais moins solide si on appuie fort. Normal : bon pour la plupart des figurines et pièces. Solide : beaucoup de matière dedans, plus lourd et plus costaud, mais plus long et plus de filament.
contexte = F1 remplissage

[imprimante.param_remplissage_leger]
texte = Léger : intérieur peu rempli, environ 10 pour cent. Léger et rapide.
contexte = choix

[imprimante.param_remplissage_normal]
texte = Normal : intérieur à environ 20 pour cent. Solide au toucher sans gaspiller le filament.
contexte = choix

[imprimante.param_remplissage_solide]
texte = Solide : intérieur à environ 40 pour cent. Plus résistant, plus long.
contexte = choix

[imprimante.q_supports_titre]
texte = Supports pour les parties en surplomb.
contexte = question 3

[imprimante.q_supports_aide]
texte = Si une partie de l'objet avance dans le vide, comme un bras tendu ou un menton, le plastique n'a rien sous lui pour se poser et peut s'affaisser. Les supports sont des petites colonnes temporaires imprimées en même temps, qu'on casse ou qu'on retire après. Oui : indispensables s'il y a des surplombs. Non : plus simple à démarrer, seulement si le modèle repose bien sur sa base sans avancer dans le vide.
contexte = F1 supports

[imprimante.param_supports_non]
texte = Pas de supports. À choisir si le modèle n'a pas de parties qui avancent dans le vide.
contexte = choix

[imprimante.param_supports_oui]
texte = Avec supports. Petites structures temporaires sous les surplombs, à retirer après.
contexte = choix

[imprimante.q_adherence_titre]
texte = Aide pour que l'objet accroche au plateau.
contexte = question 4

[imprimante.q_adherence_aide]
texte = Au début, la première couche doit coller au plateau chauffé. Si elle se décolle, l'objet rate. Rien : seulement l'objet, si ton plateau accroche très bien. Jupe, dite skirt : un ou deux tours de plastique autour de l'objet sans le toucher, pour amorcer le flux et vérifier que la buse dépose bien. Bordure, dite brim : une fine nappe collée au pied de l'objet, qui élargit la base ; on la détache après. Radeau, dit raft : un vrai petit radeau sous tout l'objet, plus facile à décoller du plateau mais laisse une texture dessous. Pour commencer, la jupe est souvent le bon choix.
contexte = F1 adherence

[imprimante.param_adherence_rien]
texte = Rien de plus : seulement l'objet sur le plateau.
contexte = choix

[imprimante.param_adherence_skirt]
texte = Jupe : quelques tours autour de l'objet pour tester le flux, sans y coller. Recommandé.
contexte = choix

[imprimante.param_adherence_brim]
texte = Bordure : fine nappe autour du pied de l'objet pour mieux coller. À détacher ensuite.
contexte = choix

[imprimante.param_adherence_raft]
texte = Radeau : plateau temporaire sous tout l'objet. Accroche fort, texture en dessous.
contexte = choix

