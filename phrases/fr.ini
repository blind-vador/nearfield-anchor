contexte = S refusé aux vérifications

[imprimante.cal.liaison_apres_erreur]
texte = L'imprimante est coupée d'OctoPrint depuis un arrêt d'urgence ou une erreur. Éteins-la, attends cinq secondes, rallume-la, puis appuie sur L pour la reconnecter. Entrée pour revérifier.
contexte = vérifications : liaison en erreur
garder = L, Entrée

[imprimante.cal.liaison_fermee]
texte = L'imprimante n'est pas reliée à OctoPrint. Vérifie qu'elle est allumée, puis appuie sur L pour la connecter. Entrée pour revérifier.
contexte = vérifications : liaison fermée
garder = L, Entrée

[imprimante.cal.octoprint_muet]
texte = OctoPrint ne répond pas. Il redémarre peut-être : réessaie dans une minute.
contexte = OctoPrint injoignable pendant le calibrage

[imprimante.cal.refus_octoprint]
texte = OctoPrint refuse la demande. Vérifie la clé OctoPrint dans les réglages.
contexte = OctoPrint refuse

[imprimante.cal.thermistance]
texte = {nom} : {valeur} degrés, valeur impossible. Le capteur de température est peut-être débranché. Ne lance aucune chauffe avant d'avoir vérifié.
contexte = vérifications : température aberrante

[imprimante.cal.chauffe_allumee]
texte = {nom} en chauffe : {reelle} degrés sur {cible}. Régler le plateau chaud, c'est même plus juste.
contexte = vérifications : chauffe en cours

[imprimante.cal.flux_absent]
texte = Je n'arrive pas à suivre l'imprimante en direct : les capteurs ne seront pas lus.
contexte = websocket indisponible

[imprimante.cal.profil_different]
texte = Pour information : OctoPrint croit le plateau de {largeur} sur {profondeur} millimètres, l'imprimante dit {x} sur {y}. Je prends la valeur de l'imprimante.
contexte = profil OctoPrint différent du firmware

[imprimante.cal.sonde_presente]
texte = Sonde de plateau détectée : le petit boîtier à tige, {gauche} millimètres à gauche de la buse et {avant} vers l'avant. Réglage de hauteur de la sonde : {hauteur} millimètre.
contexte = vérifications : sonde trouvée

[imprimante.cal.sans_sonde]
texte = Pas de sonde de plateau : la hauteur se règle avec un interrupteur et le plateau à la feuille de papier.
contexte = vérifications : pas de sonde

[imprimante.cal.capteurs_intro]
texte = Je lis les capteurs en continu et je te dis chaque changement aussitôt.
contexte = début du test des capteurs

[imprimante.cal.test_x]
texte = Appuie du doigt sur la butée X : le petit interrupteur que la tête vient toucher tout à gauche. Garde appuyé environ deux secondes, puis relâche : je ne lis les capteurs qu'une fois par seconde et demie. N si tu ne la trouves pas.
contexte = test de la butée X
garder = N

[imprimante.cal.test_y]
texte = Maintenant la butée Y : l'interrupteur que le plateau vient toucher au bout de sa course. Garde appuyé environ deux secondes, puis relâche. N si tu ne la trouves pas.
contexte = test de la butée Y
garder = N

[imprimante.cal.test_sonde]
texte = Test de la sonde. Appuie sur Entrée : la tête monte un peu et la tige de la sonde sort par-dessous. Je dois lire libre. Ensuite viendra le test en vrai, avec ton doigt.
contexte = test de la sonde, avant sa sortie
garder = Entrée

[imprimante.cal.test_z]
texte = Butée Z : appuie sur l'interrupteur du bas de l'axe vertical, puis relâche.
contexte = test de la butée Z mécanique

[imprimante.cal.butee_deja]
texte = Attention : la butée {axe} est déjà appuyée alors que personne n'y touche. La tête ou le plateau est peut-être contre, ou l'interrupteur est coincé.
contexte = butée appuyée au début du test

[imprimante.cal.butee_appuyee]
texte = Butée {axe} appuyée.
contexte = lecture en direct d'une butée

[imprimante.cal.butee_relachee]
texte = Butée {axe} relâchée.
contexte = lecture en direct d'une butée

[imprimante.cal.butee_ok]
texte = Butée {axe} : elle fonctionne.
contexte = butée testée avec succès

[imprimante.cal.butee_passee]
texte = Butée {axe} non testée.
contexte = butée passée avec N

[imprimante.cal.sonde_touchee]
texte = Sonde : touchée.
contexte = lecture en direct de la sonde

[imprimante.cal.sonde_libre]
texte = Sonde : libre.
contexte = lecture en direct de la sonde

[imprimante.cal.fil_present]
texte = Capteur de filament : fil présent.
contexte = lecture en direct du capteur de fil

[imprimante.cal.fil_absent]
texte = Capteur de filament : pas de fil.
contexte = lecture en direct du capteur de fil

[imprimante.cal.sortie_lancee]
texte = La tête monte et la tige sort.
contexte = Entrée au test de la sonde

[imprimante.cal.occupe_sonde]
texte = sortie de la tige de la sonde
contexte = complète « Patiente : »

[imprimante.cal.tige_sortie]
texte = Tige sortie et signal libre : c'est bon. Maintenant, pousse doucement la tige vers le haut du bout du doigt, et garde-la poussée deux secondes. Je dois dire touchée.
contexte = sonde sortie, en attente de l'appui

[imprimante.cal.tige_bloquee]
texte = La tige devrait être sortie, mais je lis encore touchée. Si la sonde clignote, elle est en alarme. Je range la tige. Relance l'étape : la sonde est réinitialisée à chaque essai.
contexte = la sonde reste touchée après sa sortie
garder = A

[imprimante.cal.sonde_ok]
texte = La sonde fonctionne.
contexte = sonde validée

[imprimante.cal.capteurs_fini]
texte = Test des capteurs terminé. Entrée pour l'étape suivante.
contexte = fin du test des capteurs
garder = Entrée

[imprimante.cal.capteur_attendu]
texte = J'attends encore ce test. {quoi}
contexte = Entrée pressée trop tôt au test des capteurs

[imprimante.cal.capteurs_inconnus]
texte = Pas encore de relevé des capteurs.
contexte = touche C sans relevé

[imprimante.cal.releve_ancien]
texte = Relevé vieux de {secondes} secondes.
contexte = relevé des capteurs pas frais

[imprimante.cal.origines_consigne]
texte = Entrée : la tête va en butée à gauche, le plateau en butée ; deux petits chocs sur chaque interrupteur, c'est normal, l'imprimante revient vérifier doucement. Ensuite la sonde se place au-dessus du centre, sa tige sort, et la tête descend lentement jusqu'à ce que la tige touche. Si tu entends la buse frotter ou un grincement, appuie sur Espace : arrêt d'urgence.
contexte = consigne de la mise à l'origine
garder = Entrée, Espace

[imprimante.cal.origine_z_refusee]
texte = La sonde n'a pas été validée au test des capteurs : je ne fais l'origine que de X et Y, pas de la hauteur, pour ne pas écraser la buse sur le plateau. Entrée pour l'origine de X et Y.
contexte = origine Z refusée sans sonde validée
garder = Entrée

[imprimante.cal.origines_deja]
texte = Les origines sont déjà faites. Entrée pour passer au réglage du plateau.
contexte = étape origines déjà faite
garder = Entrée

[imprimante.cal.origines_lancees]
texte = Mise à l'origine. D'abord la gauche et le fond : deux petits chocs sur chaque interrupteur, c'est normal. Espace pour arrêter.
contexte = origine lancée
garder = Espace

[imprimante.cal.xy_seuls]
texte = Origine de X et Y faite. Pas d'origine en hauteur sans sonde validée. Entrée pour le réglage du plateau à la feuille.
contexte = origine XY seule faite
garder = Entrée

[imprimante.cal.xy_faits_z_lance]
texte = X et Y faits. La tête se place au centre et descend vers le plateau. Espace pour arrêter en urgence.
contexte = origine XY faite, Z commence
garder = Espace

[imprimante.cal.z_long]
texte = C'est plus long que prévu. Si tu entends cogner ou grincer, appuie sur Espace : arrêt complet.
contexte = origine Z anormalement longue
garder = Espace

[imprimante.cal.origines_faites]
texte = Origine faite : l'imprimante sait où elle est. La buse est à {z} millimètres au-dessus du plateau.
contexte = origines réussies
garder = Entrée

[imprimante.cal.sans_reponse_xy]
texte = L'imprimante n'a pas confirmé la fin de l'origine de X et Y. Écoute si elle bouge encore, puis réessaie avec Entrée.
contexte = pas de réponse après l'origine XY
garder = Entrée

[imprimante.cal.sans_reponse_z]
texte = Toujours pas de fin d'origine en hauteur après deux minutes et demie. Si la tête est immobile, réessaie ; si elle grince, Espace.
contexte = origine Z sans réponse
garder = Espace

[imprimante.cal.echec_origine]
texte = L'imprimante a abandonné la mise à l'origine : la sonde ou la butée n'a rien senti. Elle s'est mise en sécurité. Éteins-la, rallume-la, puis refais le test des capteurs.
contexte = message firmware : échec d'origine

[imprimante.cal.echec_mesure]
texte = La mesure a échoué : la sonde n'a pas touché le plateau. Vérifie que la tige sort bien, puis réessaie.
contexte = message firmware : échec de mesure

[imprimante.cal.echec_sonde_hors_plateau]
texte = Ce point est hors de portée de la sonde : l'imprimante a refusé la mesure, rien n'a bougé.
contexte = message firmware : sonde hors plateau

[imprimante.cal.echec_tige]
texte = La tige de la sonde n'a pas pu sortir ou se ranger. La sonde est peut-être en alarme : au test des capteurs, la touche A la réinitialise.
contexte = message firmware : sonde en défaut
garder = A

[imprimante.cal.echec_fige]
texte = L'imprimante s'est arrêtée par sécurité et ne répond plus. Éteins-la, attends cinq secondes, rallume-la, puis dis reconnecte imprimante.
contexte = message firmware : arrêt de sécurité

[imprimante.cal.echec_autre]
texte = L'imprimante signale un problème : {texte}.
contexte = message firmware non traduit

[imprimante.cal.erreur_interne]
texte = Erreur inattendue du calibrage ; le détail est dans le journal de la console.
contexte = exception dans le calibrage

[imprimante.cal.urgence]
texte = Arrêt complet envoyé. L'imprimante est figée. Éteins-la, attends cinq secondes, rallume-la, puis relance le calibrage.
contexte = Espace pendant un mouvement

[imprimante.cal.deja_fige]
texte = L'imprimante est figée après l'arrêt d'urgence. Échap pour quitter, puis éteins-la et rallume-la.
contexte = touche après un arrêt d'urgence
garder = Échap

[imprimante.cal.plateau_consigne]
texte = La sonde va mesurer le centre puis les quatre coins. Pour chaque coin, je dis de combien il est trop haut ou trop bas, et de combien tourner sa molette. Serrer la molette, c'est la faire remonter vers le dessous du plateau : le ressort s'écrase et le coin descend. Desserrer fait monter le coin. Entrée : mesurer. Touches 1 à 4 : remesurer un seul coin, dans l'ordre avant gauche, avant droit, arrière droit, arrière gauche. F : méthode de la feuille de papier.
contexte = consigne du réglage du plateau par sonde
garder = Entrée, F

[imprimante.cal.mesure_lancee]
texte = Mesure lancée. Ne touche pas au plateau pendant les mesures.
contexte = mesure du plateau lancée

[imprimante.cal.occupe_mesure]
texte = mesure du plateau
contexte = complète « Patiente : »

[imprimante.cal.mesure_centre]
texte = Mesure du centre, qui sert de référence.
contexte = première mesure

[imprimante.cal.coin_bon]
texte = {point} : bon.
contexte = coin dans la tolérance

[imprimante.cal.coin_haut]
texte = {point} : trop haut de {mm} millimètre. Serre sa molette d'environ {tours}.
contexte = coin trop haut

[imprimante.cal.coin_bas]
texte = {point} : trop bas de {mm} millimètre. Desserre sa molette d'environ {tours}.
contexte = coin trop bas

[imprimante.cal.tour_tres_peu]
texte = un tout petit peu, moins d'un huitième de tour
contexte = quantité de rotation de molette

[imprimante.cal.tour_huitieme]
texte = un huitième de tour
contexte = quantité de rotation de molette

[imprimante.cal.tour_quart]
texte = un quart de tour
contexte = quantité de rotation de molette

[imprimante.cal.tour_demi]
texte = un demi-tour
contexte = quantité de rotation de molette

[imprimante.cal.tour_trois_quarts]
texte = trois quarts de tour
contexte = quantité de rotation de molette

[imprimante.cal.tour_n]
texte = {n} tours
contexte = quantité de rotation de molette

[imprimante.cal.mieux]
texte = C'est mieux qu'avant.
contexte = coin remesuré, amélioré

[imprimante.cal.moins_bien]
texte = C'est moins bien qu'avant : tourne plutôt dans l'autre sens.
contexte = coin remesuré, empiré

[imprimante.cal.plateau_ok]
texte = Plateau réglé : les quatre coins sont à moins de cinq centièmes de millimètre du centre.
contexte = plateau réglé
garder = Entrée, Échap

[imprimante.cal.plateau_a_regler]
texte = Plus grand écart : {mm} millimètre. Tourne les molettes indiquées, puis Entrée pour tout remesurer, ou le chiffre d'un coin pour le remesurer seul.
contexte = fin d'une série de mesures
garder = Entrée

[imprimante.cal.mesure_muette]
texte = {point} : pas de résultat de mesure. Réessaie avec Entrée.
contexte = G30 sans réponse

[imprimante.cal.plateau_sans_origine]
texte = Il faut d'abord faire les origines, à l'étape précédente.
contexte = mesure demandée sans origine

[imprimante.cal.feuille_consigne]
texte = Méthode de la feuille : prends une feuille de papier ordinaire. Entrée : la tête va au premier coin. Glisse la feuille sous la buse et tourne la molette de ce coin jusqu'à sentir un léger frottement en faisant bouger la feuille. Entrée : coin suivant. Fais deux tours complets.
contexte = consigne du réglage à la feuille
garder = Entrée

[imprimante.cal.feuille_premier]
texte = {point}. Je ne connais pas encore la hauteur exacte. Glisse la feuille sous la buse, puis Page suivante pour descendre d'un dixième de millimètre à la fois, Page précédente pour remonter. Quand la feuille frotte légèrement, appuie sur Entrée : ce sera la hauteur zéro.
contexte = premier coin à la feuille, sans origine en hauteur
garder = Page suivante, Page précédente, Entrée

[imprimante.cal.feuille_zero_fait]
texte = Hauteur zéro notée ici. Entrée : coin suivant.
contexte = zéro défini à la feuille
garder = Entrée

[imprimante.cal.feuille_coin]
texte = {point} : buse à la hauteur zéro. Fais glisser la feuille et tourne la molette de ce coin jusqu'au léger frottement. Entrée : coin suivant.
contexte = coin à la feuille
garder = Entrée

[imprimante.cal.z_monte]
texte = Monte de {pas} millimètre.
contexte = déplacement vertical fin

[imprimante.cal.z_descend]
texte = Descend de {pas} millimètre.
contexte = déplacement vertical fin

[imprimante.cal.hauteur_consigne]
texte = Réglage fin de la hauteur de la buse, avec une feuille de papier. Entrée : la buse va au centre du plateau, à la hauteur zéro. La buse doit être froide.
contexte = consigne de la hauteur de buse
garder = Entrée, Échap

[imprimante.cal.hauteur_impossible]
texte = Le réglage de hauteur demande la sonde et les origines faites. Entrée ou Échap pour terminer.
contexte = hauteur de buse indisponible
garder = Entrée, Échap

[imprimante.cal.hauteur_lancee]
texte = La buse va au centre, à la hauteur zéro.
contexte = hauteur de buse lancée

[imprimante.cal.occupe_hauteur]
texte = mise en place au centre
contexte = complète « Patiente : »

[imprimante.cal.hauteur_prete]
texte = Buse au centre, à la hauteur zéro. Glisse la feuille sous la buse. Page suivante : descendre, Page précédente : monter, de {pas} millimètre par appui. Si la feuille passe très librement, la touche plus donne des pas plus grands ; moins, des pas plus fins pour finir. Quand la feuille frotte légèrement, appuie sur Entrée.
contexte = buse prête pour la hauteur
garder = Page suivante, Page précédente, Entrée

[imprimante.cal.hauteur_actuelle]
texte = Hauteur {z}.
contexte = hauteur de la buse

[imprimante.cal.hauteur_limite]
texte = Je ne descends pas plus bas : deux millimètres sous le zéro, c'est le maximum. Si la feuille ne frotte toujours pas, la sonde ou le plateau ont un problème.
contexte = limite basse atteinte

[imprimante.cal.decalage_propose]
texte = Frottement à cette hauteur. Nouveau réglage de la sonde : {nouveau} millimètre, au lieu de {ancien}. Entrée encore une fois pour l'enregistrer dans l'imprimante, ou Échap pour ne rien changer.
contexte = nouveau décalage proposé
garder = Entrée, Échap

[imprimante.cal.decalage_inchange]
texte = Frottement exactement au zéro : le réglage actuel, {valeur} millimètre, est déjà bon. Entrée pour terminer.
contexte = décalage déjà juste
garder = Entrée

[imprimante.cal.decalage_aberrant]
texte = Réglage calculé aberrant : {valeur} millimètres. Je n'enregistre rien. Vérifie la feuille et la sonde.
contexte = décalage hors bornes

[imprimante.cal.decalage_enregistre]
texte = Enregistré : réglage de la sonde à {valeur} millimètre. Il servira dès la prochaine mise à l'origine. Entrée pour continuer.
contexte = décalage enregistré
garder = Entrée, Échap

[imprimante.cal.touche_sans_action]
texte = Touche sans effet à cette étape. F1 pour l'aide.
contexte = touche inconnue
garder = F1

[imprimante.cal.reconnexion_lancee]
texte = Reconnexion de l'imprimante, cela prend jusqu'à une minute.
contexte = R aux vérifications

[imprimante.cal.occupe_reconnexion]
texte = reconnexion de l'imprimante
contexte = complète « Patiente : »

[imprimante.cal.ferme]
texte = Calibrage fermé.
contexte = fin du calibrage

[imprimante.cal.ferme_mouvement]
texte = Calibrage fermé. Le mouvement en cours va se terminer tout seul.
contexte = fermeture pendant un mouvement

[imprimante.cal.aide_verifs]
texte = Cette étape vérifie que tout est prêt avant de faire bouger quoi que ce soit : liaison, températures, firmware et sonde. Entrée : continuer ou revérifier.
contexte = aide F1
garder = Entrée, L

[imprimante.cal.aide_capteurs]
texte = Cette étape vérifie que l'imprimante sent bien ses butées et sa sonde, avant tout mouvement automatique. Butées X et Y : appuie deux secondes et relâche, je dis ce que je lis. Sonde : Entrée la fait sortir ; Entrée encore lance le test en vrai : la tête descend lentement, tu pousses la tige, et l'imprimante doit s'arrêter net. A : réinitialise la sonde si sa lumière clignote. N : passer une butée introuvable.
contexte = aide F1
garder = Entrée, A, N

[imprimante.cal.aide_origines]
texte = La mise à l'origine apprend à l'imprimante où sont ses bords et le plateau. Entrée la lance. Pour la hauteur, la tête descend par petits pas tige sortie, et l'origine finale ne part que si la tige a touché. Espace pendant le mouvement : arrêt d'urgence.
contexte = aide F1
garder = Entrée, Espace

[imprimante.cal.aide_plateau]
texte = Le réglage du plateau le rend parallèle au trajet de la buse. Entrée : mesurer les quatre coins. 1 à 4 : un seul coin. F : méthode de la feuille. Serrer une molette fait descendre son coin, desserrer le fait monter.
contexte = aide F1
garder = Entrée, F

[imprimante.cal.aide_hauteur]
texte = La hauteur de la buse règle l'écrasement de la première couche. Page suivante descend la buse, Page précédente la monte. Plus et moins changent le pas. Quand la feuille frotte légèrement en la tirant, Entrée propose le réglage, Entrée encore l'enregistre.
contexte = aide F1
garder = Page suivante, Page précédente, Entrée

[imprimante.cal.aide_commune]
texte = Partout : R répète, C lit les capteurs, T les températures, S passe l'étape, Échap quitte. Pendant un mouvement, Espace arrête.
contexte = aide F1, fin
garder = R, C, T, S, Échap

[imprimante.fw.echec_origine]
texte = Échec de la mise à l'origine : un capteur n'a rien senti. L'imprimante s'est mise en sécurité.
contexte = message firmware traduit

[imprimante.fw.echec_mesure]
texte = Échec de mesure de la sonde : elle n'a pas touché le plateau.
contexte = message firmware traduit

[imprimante.fw.arret_securite]
texte = Imprimante arrêtée par sécurité : il faut l'éteindre et la rallumer.
contexte = message firmware traduit

[imprimante.fw.emballement]
texte = Emballement thermique : la température ne suit pas la chauffe. Chauffe coupée par sécurité. Vérifie le capteur de température et l'élément chauffant.
contexte = message firmware traduit

[imprimante.fw.chauffe_echouee]
texte = La chauffe a échoué : la température ne monte pas.
contexte = message firmware traduit

[imprimante.fw.temp_basse]
texte = Température anormalement basse : capteur de température débranché ou cassé. Chauffe coupée.
contexte = message firmware traduit

[imprimante.fw.temp_haute]
texte = Température anormalement haute : chauffe coupée par sécurité.
contexte = message firmware traduit

[imprimante.fw.extrusion_froide]
texte = Extrusion refusée : la buse est trop froide.
contexte = message firmware traduit

[imprimante.fw.sonde_tige]
texte = La sonde n'a pas pu sortir ou ranger sa tige.
contexte = message firmware traduit

[imprimante.fw.origine_dabord]
texte = L'imprimante refuse : il faut d'abord faire l'origine des axes.
contexte = message firmware traduit

[imprimante.fw.non_traduit]
texte = Message de l'imprimante : {texte}.
contexte = message firmware sans traduction

[imprimante.liaison.operational]
texte = prête
contexte = état de la liaison OctoPrint

[imprimante.liaison.printing]
texte = en impression
contexte = état de la liaison OctoPrint

[imprimante.liaison.paused]
texte = en pause
contexte = état de la liaison OctoPrint

[imprimante.liaison.closed]
texte = déconnectée
contexte = état de la liaison OctoPrint

[imprimante.liaison.offline]
texte = déconnectée
contexte = état de la liaison OctoPrint

[imprimante.liaison.offline_after_error]
texte = coupée après une erreur
contexte = état de la liaison OctoPrint

[imprimante.liaison.error]
texte = en erreur
contexte = état de la liaison OctoPrint

[imprimante.liaison.connecting]
texte = connexion en cours
contexte = état de la liaison OctoPrint

[imprimante.liaison.detecting]
texte = recherche de la liaison
contexte = état de la liaison OctoPrint

[imprimante.cal.pas]
texte = Pas de {pas} millimètre.
contexte = pas du déplacement vertical fin, au calibrage

[imprimante.cal.rien_a_repeter]
texte = Rien à répéter pour l'instant.
contexte = R sans historique

[imprimante.cal.plus_ancien]
texte = Plus ancien message :
contexte = R arrivé au début de l'historique

[imprimante.cal.tige_longueur]
texte = Buse froide : profites-en pour comparer du doigt. La pointe de la tige sortie doit descendre deux à trois millimètres plus bas que le bout de la buse. Si elle est plus haute que la buse, la buse touchera le plateau avant la tige : il faudra descendre la sonde sur son support.
contexte = contrôle de la longueur de tige

[imprimante.cal.approche_lancee]
texte = Mouvement lancé, ne touche pas l'imprimante. Elle remonte un peu, sa tige sort, puis elle descend lentement, de {mm} millimètres au plus, jusqu'à ce que la tige touche le verre. Espace si tu entends frotter ou claquer.
contexte = début de l'approche contrôlée
garder = Espace

[imprimante.cal.approche_progres]
texte = Je descends toujours, environ {mm} millimètres.
contexte = progression de la descente, phrase très courte

[imprimante.cal.approche_touche]
texte = La tige a touché le plateau après environ {mm} millimètres de descente : la sonde fonctionne en vrai.
contexte = la sonde a touché pendant l'approche

[imprimante.cal.approche_tige_bloquee]
texte = La tige ne semble pas sortie : je lis touchée au-dessus du plateau. Approche annulée, rien n'est descendu. Refais le test de la sonde, touche A si sa lumière clignote.
contexte = approche annulée, sonde pas libre
garder = A

[imprimante.cal.approche_rien]
texte = La tête est descendue de {mm} millimètres sans que la tige touche. Elle est remontée d'un centimètre. Deux causes possibles : soit l'écart tapé était plus petit que le vrai, alors remesure et refais l'étape ; soit la buse arrive au verre avant la tige, tu l'aurais entendue claquer une seconde, alors il faut descendre la sonde sur son support.
contexte = approche sans contact

[imprimante.cal.z_court_lance]
texte = Contact. Dernière mise à l'origine de la hauteur, toute proche : la tête remonte un peu, puis touche deux fois, une rapide, une lente. Quelques secondes. Ce mouvement-là ne s'arrête pas en douceur : Espace serait un arrêt complet.
contexte = origine Z après l'approche

[imprimante.cal.z_urgence_auto]
texte = L'origine de la hauteur dure trop : arrêt complet envoyé pour protéger la buse. Éteins l'imprimante, rallume-la, puis relance le calibrage.
contexte = arrêt d'urgence automatique

[imprimante.cal.tige_sortie_vol]
texte = Tige sortie et signal libre. Maintenant le test en vrai, comme pendant une origine, mais loin du plateau. Mets le bout du doigt juste sous la tige, sans la toucher. Entrée : la tête descend très lentement de {mm} millimètres. Pendant la descente, pousse la tige vers le haut. Si l'imprimante voit le contact, la tête s'arrête net.
contexte = test en vol de la sonde, consigne
garder = Entrée

[imprimante.cal.vol_lance]
texte = La tête descend lentement. Pousse la tige maintenant.
contexte = test en vol lancé

[imprimante.cal.occupe_vol]
texte = test de la sonde en descente
contexte = complète « Patiente : »

[imprimante.cal.vol_ok]
texte = Arrêt net après environ {mm} millimètres : l'imprimante voit le contact de la sonde. Elle est bonne pour l'origine. La tige se range.
contexte = test en vol réussi

[imprimante.cal.vol_rien]
texte = La tête est descendue jusqu'au bout sans s'arrêter : l'imprimante n'a pas vu le contact. Si tu as bien poussé la tige et qu'elle est remontée, c'est la panne qui fait marteler le plateau : la sonde sent le contact, mais le signal n'arrive pas à la carte. Entrée pour ressortir la tige et réessayer.
contexte = test en vol sans contact, première fois
garder = Entrée

[imprimante.cal.vol_rien_encore]
texte = Toujours aucun contact vu par l'imprimante. Pas d'origine en hauteur possible tant que ce n'est pas réglé. À vérifier : la prise où arrive le câble de la sonde sur la carte, les fils blanc et noir du câble, et la version du firmware. S pour passer à l'origine de X et Y seulement.
contexte = test en vol sans contact, à nouveau
garder = S


# --- calibrage guide v2 (2026-10-16) ---

[imprimante.cal.nom_etape.decouverte]
texte = Découverte de la machine
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.sonde]
texte = Test de la sonde
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.hauteur_sonde]
texte = Hauteur de la sonde
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.ongle]
texte = Test à l'ongle
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.origine]
texte = Mise à l'origine
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.repetabilite]
texte = Fidélité de la sonde
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.molettes]
texte = Réglage des molettes
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.nom_etape.carte]
texte = Carte du plateau
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.arret_doux]
texte = Arrêt. La tête s'arrête net et va remonter.
contexte = M410 envoyé

[imprimante.cal.arret_remonte]
texte = Tête arrêtée et remontée de {mm} millimètres. L'imprimante reste allumée. Entrée pour reprendre l'étape.
contexte = après M410

[imprimante.cal.buse_chaude]
texte = La buse est chaude, {valeur} degrés. Attends qu'elle refroidisse avant de toucher la machine.
contexte = buse chaude aux vérifications

[imprimante.cal.sans_arret_doux]
texte = Le firmware n'a pas l'arrêt doux : Espace serait un arrêt complet. Il faut le firmware de diagnostic ou plus récent.
contexte = EMERGENCY_PARSER absent

[imprimante.cal.sonde_absente]
texte = Le firmware ne voit pas de sonde de plateau. Le calibrage guidé en a besoin.
contexte = pas de sonde

[imprimante.cal.sans_carte]
texte = Ce firmware ne sait pas faire de carte du plateau : la dernière étape sera sautée.
contexte = AUTOLEVEL absent

[imprimante.cal.sans_origine]
texte = Il faut d'abord la mise à l'origine. Entrée : je la fais maintenant.
contexte = étape qui demande l'origine

[imprimante.cal.carte_origine]
texte = Le réglage de hauteur a changé : Entrée refait d'abord la mise à l'origine.
contexte = carte après changement du décalage

[imprimante.cal.fini]
texte = Calibrage terminé. L'imprimante est prête à imprimer. Échap pour quitter.
contexte = fin du calibrage

[imprimante.cal.reorigine_lancee]
texte = L'imprimante connaît sa position : origine de la hauteur directe, quelques secondes. Mouvement lancé, ne touche pas l'imprimante.
contexte = G28 Z direct

[imprimante.cal.reorigine_faite]
texte = Origine refaite avec le nouveau réglage de la sonde.
contexte = G28 Z direct fini

[imprimante.cal.ce_point]
texte = Ce point
contexte = nom générique d'un point mesuré

[imprimante.cal.decouverte_consigne]
texte = Première rencontre avec la machine. Je vais te la décrire élément par élément, pour la découvrir au toucher : où chercher, ce que tu sens, à quoi ça sert, et la prudence à avoir. La description vient de Gemini, à partir du modèle exact branché au Pi. Entrée pour commencer, S pour passer.
contexte = étape découverte

[imprimante.cal.decouverte_deja]
texte = Tu as déjà fait la découverte de la machine. Entrée pour la refaire, S pour passer.
contexte = découverte déjà faite

[imprimante.cal.decouverte_lancee]
texte = Je prépare la description de la machine. Quelques secondes.
contexte = appel Gemini

[imprimante.cal.occupe_decouverte]
texte = Je prépare la description de la machine.
contexte = tâche en cours

[imprimante.cal.decouverte_secours]
texte = Gemini ne répond pas : je prends une description générale, moins précise.
contexte = repli sans Gemini

[imprimante.cal.decouverte_suite]
texte = {n} éléments à découvrir. Entrée pour le premier.
contexte = début de la visite

[imprimante.cal.element]
texte = {n} sur {total} : {nom}.
contexte = titre d'un élément de la visite

[imprimante.cal.element_role]
texte = Il sert à : {role}.
contexte = rôle d'un élément

[imprimante.cal.element_prudence]
texte = Prudence : {prudence}.
contexte = prudence pour un élément

[imprimante.cal.element_touches]
texte = Entrée si tu l'as trouvé, N sinon, Page précédente pour revenir.
contexte = touches de la visite

[imprimante.cal.decouverte_finie]
texte = Visite terminée.
contexte = fin de la visite

[imprimante.cal.decouverte_manques]
texte = Pas trouvés : {liste}. On pourra les chercher ensemble plus tard.
contexte = éléments non trouvés

[imprimante.cal.sonde_consigne]
texte = Test intégré de la sonde. La tête ne bouge pas. La carte sort la tige plusieurs fois toute seule, puis je te dirai de pousser la tige vers le haut, doucement, du bout de l'ongle. Mets la main près de la sonde, sans la toucher. Entrée pour lancer.
contexte = étape test de la sonde

[imprimante.cal.sonde_lance]
texte = Test lancé. Attends mon signal.
contexte = M43 S lancé

[imprimante.cal.sonde_reconnue]
texte = La carte reconnaît une sonde de type BLTouch.
contexte = M43 S, détection

[imprimante.cal.sonde_pousse]
texte = Maintenant : pousse la tige vers le haut, du bout de l'ongle.
contexte = M43 S attend l'appui

[imprimante.cal.sonde_impulsion]
texte = Signal reçu, {ms} millisecondes.
contexte = durée du signal

[imprimante.cal.sonde_v31]
texte = Modèle : BLTouch version 3.1 ou compatible.
contexte = modèle vu

[imprimante.cal.sonde_ancienne]
texte = Modèle : BLTouch ancienne ou compatible. Elle convient.
contexte = modèle vu

[imprimante.cal.sonde_rien]
texte = Je n'ai pas senti d'appui en trente secondes. Entrée pour recommencer.
contexte = M43 S sans appui

[imprimante.cal.sonde_parasite]
texte = Signal parasite. Entrée pour recommencer, en poussant franchement la tige.
contexte = M43 S bruit

[imprimante.cal.sonde_echec]
texte = La carte ne reconnaît pas la sonde. Il ne faut pas aller plus loin : vérifie son câble.
contexte = M43 S échec

[imprimante.cal.hauteur_sonde_consigne]
texte = Contrôle au toucher, la buse doit être froide. Tige rangée, sa pointe doit être environ deux millimètres au-dessus de la pointe de la buse : la buse descend plus bas que la sonde. Tige sortie, la tige doit dépasser sous la buse. D sort la tige, U la range. Entrée si c'est bon, N si tu as un doute.
contexte = étape hauteur de la sonde

[imprimante.cal.tige_sortie_toucher]
texte = Tige sortie. Elle doit dépasser sous la pointe de la buse.
contexte = M280 S10

[imprimante.cal.tige_rangee_toucher]
texte = Tige rangée. Sa pointe doit être un peu plus haute que la pointe de la buse.
contexte = M280 S90

[imprimante.cal.hauteur_sonde_doute]
texte = Noté. Si la tige sortie ne dépasse pas sous la buse, la buse touchera le plateau avant la sonde : il faudra remonter la buse ou descendre la sonde avant d'aller plus loin. Entrée quand c'est vérifié.
contexte = doute sur la hauteur de la sonde

[imprimante.cal.nom_etape.sens_z]
texte = Sens du moteur Z
contexte = nom d'une étape du calibrage, début de phrase

[imprimante.cal.sens_consigne]
texte = Vérification du sens du moteur de hauteur. Il faut au moins deux centimètres de place au-dessus de la tête. Pose un doigt sur le dessus de la tête. Entrée : elle monte d'un centimètre, s'arrête une seconde, puis redescend.
contexte = étape sens du moteur Z

[imprimante.cal.sens_lance]
texte = Doigt sur le dessus de la tête. Attention, elle bouge.
contexte = test du sens lancé

[imprimante.cal.occupe_sens]
texte = Test du sens du moteur en cours.
contexte = tâche en cours

[imprimante.cal.sens_question]
texte = La tête a-t-elle d'abord monté ? Entrée : oui, elle a monté. N : non, elle a d'abord descendu. T : refaire le mouvement.
contexte = question du sens

[imprimante.cal.sens_ok]
texte = Le moteur de hauteur tourne dans le bon sens.
contexte = sens confirmé

[imprimante.cal.sens_inverse]
texte = Le sens du moteur de hauteur est inversé dans le firmware. Il ne faut aller plus loin sous aucun prétexte : chaque descente monterait en butée. Échap pour quitter, il faut corriger le firmware.
contexte = sens inversé

[imprimante.cal.sens_dabord]
texte = D'abord le test du sens du moteur, à l'étape précédente.
contexte = ongle avant le sens

[imprimante.cal.aide_sens_z]
texte = La tête monte d'un centimètre puis redescend. Tu dis si elle a d'abord monté. Si elle descend quand on lui dit de monter, tous les mouvements de hauteur sont à l'envers.
contexte = aide sens du moteur Z

[imprimante.cal.ongle_consigne]
texte = Test en l'air : la tête descend lentement, et tu arrêtes la tige du bout de l'ongle, comme si c'était le plateau. Si l'imprimante voit le contact, la tête s'arrête net. Entrée pour commencer.
contexte = étape test à l'ongle

[imprimante.cal.ongle_hauteur]
texte = D'abord, vérifie la hauteur : pose la main à plat sur le plateau, sous la tête. Il faut au moins la hauteur de ta main entre le plateau et la buse. Entrée si c'est le cas. Sinon, H fait monter la tête de trois centimètres.
contexte = hauteur avant le test à l'ongle

[imprimante.cal.tete_monte]
texte = La tête monte de {mm} millimètres.
contexte = montée manuelle

[imprimante.cal.ongle_lance]
texte = La tête remonte d'abord un peu, puis la tige sort.
contexte = test à l'ongle lancé

[imprimante.cal.occupe_ongle]
texte = Test à l'ongle en cours.
contexte = tâche en cours

[imprimante.cal.ongle_go]
texte = Tige sortie. La tête descend lentement. Pousse la tige vers le haut avec l'ongle, maintenant.
contexte = pendant la descente

[imprimante.cal.ongle_ok]
texte = Arrêt net : l'imprimante voit la sonde. Elle peut faire son origine.
contexte = test à l'ongle réussi

[imprimante.cal.ongle_rien]
texte = La tête est descendue jusqu'au bout sans s'arrêter : l'imprimante n'a pas vu le contact. Entrée pour recommencer. Si ça se répète, n'allez pas plus loin.
contexte = test à l'ongle raté

[imprimante.cal.origine_consigne]
texte = Mise à l'origine : l'imprimante cherche la gauche, le fond, puis la hauteur avec la sonde, au centre du plateau. Rien sur le plateau. Entrée pour lancer.
contexte = étape origine

[imprimante.cal.origine_refusee]
texte = Pas d'origine tant que ces trois tests ne sont pas réussis : le test intégré de la sonde, le sens du moteur de hauteur, et le test à l'ongle.
contexte = origine refusée

[imprimante.cal.origine_mesure]
texte = Gauche et fond trouvés, la sonde est au-dessus du centre. Maintenant, mesure avec ton mètre l'écart entre la pointe de la buse et le verre, en millimètres. Tape le nombre, puis Entrée.
contexte = demande de l'écart buse-verre

[imprimante.cal.saisie_efface]
texte = Effacé. Reste : {reste}.
contexte = retour arrière pendant la saisie

[imprimante.cal.saisie_vide]
texte = rien
contexte = saisie vide

[imprimante.cal.file_occupee]
texte = L'imprimante finit encore un mouvement précédent depuis deux minutes. Je n'envoie rien de nouveau. Écoute si elle bouge, puis réessaie.
contexte = commandes précédentes pas finies

[imprimante.cal.saisie_invalide]
texte = Je n'ai pas compris. Tape l'écart en millimètres, entre 3 et {maxi}, puis Entrée.
contexte = écart invalide

[imprimante.cal.m48_consigne]
texte = Fidélité de la sonde : elle mesure dix fois le même point. Si elle trouve toujours la même hauteur, on peut lui faire confiance. Entrée pour lancer, environ une minute.
contexte = étape répétabilité

[imprimante.cal.m48_lance]
texte = Dix mesures au centre.
contexte = M48 lancé

[imprimante.cal.occupe_m48]
texte = Mesures de fidélité en cours.
contexte = tâche en cours

[imprimante.cal.m48_bon]
texte = Très bien : les dix mesures tiennent dans {microns} microns. La sonde est fiable.
contexte = M48 bon

[imprimante.cal.m48_moyen]
texte = Moyen : les mesures s'écartent de {microns} microns. Ça ira pour imprimer, mais la tige est peut-être sale ou la sonde un peu lâche. Entrée pour refaire, S pour continuer.
contexte = M48 moyen

[imprimante.cal.m48_mauvais]
texte = Pas fiable : les mesures s'écartent de {microns} microns. Il faut revoir la fixation de la sonde avant d'aller plus loin.
contexte = M48 mauvais

[imprimante.cal.molettes_consigne]
texte = Réglage des molettes, coin par coin. La sonde se place au-dessus du coin, mesure, et remesure toute seule pendant que tu tournes la molette sous ce coin. Je te dis continue, encore un peu, ou stop. La tête ne fait que monter et descendre, ta main ne risque rien sous le plateau. Entrée pour commencer.
contexte = étape molettes

[imprimante.cal.molettes_lance]
texte = Je mesure d'abord le centre.
contexte = molettes lancé

[imprimante.cal.occupe_molettes]
texte = Réglage des molettes en cours.
contexte = tâche en cours

[imprimante.cal.coin_deja_bon]
texte = {point} : déjà bon.
contexte = coin dans la tolérance

[imprimante.cal.coin_ecart_haut]
texte = {point} : trop haut de {mm} millimètre. Trouve la molette sous ce coin.
contexte = coin trop haut

[imprimante.cal.coin_ecart_bas]
texte = {point} : trop bas de {mm} millimètre. Trouve la molette sous ce coin.
contexte = coin trop bas

[imprimante.cal.apprendre_sens]
texte = Pour apprendre le sens de tes molettes : tourne celle-ci d'un quart de tour dans le sens qui la serre, comme pour visser. Puis lâche-la et appuie sur Entrée.
contexte = apprentissage du sens

[imprimante.cal.sens_appris_descend]
texte = Compris : serrer fait descendre le coin, de {mm} millimètre pour ce quart de tour. Je m'en souviendrai.
contexte = sens appris

[imprimante.cal.sens_appris_monte]
texte = Compris : serrer fait monter le coin, de {mm} millimètre pour ce quart de tour. Je m'en souviendrai.
contexte = sens appris

[imprimante.cal.sens_rien]
texte = Le coin n'a presque pas bougé. Tourne un peu plus franchement, puis Entrée.
contexte = apprentissage sans effet

[imprimante.cal.sens_echec]
texte = Je n'arrive pas à voir l'effet de la molette. Vérifie que c'est bien celle sous ce coin.
contexte = apprentissage raté

[imprimante.cal.molette_serre]
texte = Serre {tours}.
contexte = consigne de rotation

[imprimante.cal.molette_desserre]
texte = Desserre {tours}.
contexte = consigne de rotation

[imprimante.cal.continue]
texte = Bien, continue. Reste {mm}.
contexte = le coin se rapproche

[imprimante.cal.presque]
texte = Encore un peu. Reste {mm}.
contexte = presque réglé

[imprimante.cal.depasse]
texte = Tu as dépassé. Reviens un peu, dans l'autre sens.
contexte = dépassement

[imprimante.cal.mauvais_sens]
texte = Mauvais sens, ça s'éloigne.
contexte = rotation à l'envers

[imprimante.cal.stop_verifie]
texte = Stop ! Ne touche plus, je vérifie.
contexte = dans la tolérance une fois

[imprimante.cal.coin_regle]
texte = {point} : réglé.
contexte = coin réglé

[imprimante.cal.coin_passe]
texte = {point} : passé.
contexte = coin sauté

[imprimante.cal.coin_on_passe]
texte = On passe ce coin.
contexte = S pendant les molettes

[imprimante.cal.mesure_tout_de_suite]
texte = Je mesure.
contexte = Entrée pendant les molettes

[imprimante.cal.verification_tour]
texte = Les quatre coins sont faits. Régler un coin bouge un peu les autres : je refais le tour pour vérifier.
contexte = tour de vérification

[imprimante.cal.reprise]
texte = À reprendre : {liste}.
contexte = coins à refaire

[imprimante.cal.plateau_pas_fini]
texte = Après trois tours, le plateau n'est toujours pas réglé partout. Entrée pour recommencer, ou S pour continuer quand même.
contexte = molettes pas convergées

[imprimante.cal.carte_consigne]
texte = Dernière étape : la sonde mesure vingt-cinq points sur tout le plateau. L'imprimante compensera les petits creux et bosses pendant l'impression. Environ trois minutes. Entrée pour lancer.
contexte = étape carte du plateau

[imprimante.cal.carte_lancee]
texte = Carte du plateau lancée.
contexte = G29 lancé

[imprimante.cal.occupe_carte]
texte = Carte du plateau en cours.
contexte = tâche en cours

[imprimante.cal.carte_progres]
texte = Mesures en cours, {s} secondes.
contexte = progression G29

[imprimante.cal.carte_faite]
texte = Carte du plateau faite et enregistrée.
contexte = G29 fini sans grille lue

[imprimante.cal.carte_resume]
texte = Carte enregistrée. Entre le point le plus haut et le plus bas : {mm} millimètre. Le plus haut à {haut}, le plus bas à {bas}.
contexte = résumé de la carte

[imprimante.cal.sonde_rangee_lue]
texte = Sonde : tige rangée.
contexte = lecture C

[imprimante.cal.sonde_sortie_lue]
texte = Sonde : tige sortie, libre.
contexte = lecture C

[imprimante.cal.aide_decouverte]
texte = La visite décrit chaque élément de la machine. Entrée : trouvé, élément suivant. N : pas trouvé. Page précédente : élément précédent. G : redemander la description à Gemini.
contexte = aide découverte

[imprimante.cal.aide_sonde]
texte = La carte vérifie seule que la sonde répond, puis te demande de pousser la tige. Rien ne bouge à part la tige.
contexte = aide test de la sonde

[imprimante.cal.aide_hauteur_sonde]
texte = Au toucher, buse froide : la tige rangée doit être un peu plus haute que la buse, la tige sortie doit dépasser dessous. D sort, U range, Entrée valide, N note un doute.
contexte = aide hauteur de la sonde

[imprimante.cal.aide_ongle]
texte = La tête descend lentement de quinze millimètres. Pousse la tige avec l'ongle : la tête doit s'arrêter net. H monte la tête de trois centimètres avant le test.
contexte = aide test à l'ongle

[imprimante.cal.aide_origine]
texte = L'imprimante cherche ses repères : gauche, fond, puis la hauteur avec la sonde au centre. Espace arrête pendant la descente lente.
contexte = aide origine

[imprimante.cal.aide_repetabilite]
texte = Dix mesures au même point. Moins de vingt-cinq microns d'écart : la sonde est fiable.
contexte = aide répétabilité

[imprimante.cal.aide_molettes]
texte = La sonde remesure le coin en boucle. Tourne la molette sous ce coin en suivant mes indications. Entrée : mesurer tout de suite. S : passer ce coin. Espace : arrêter.
contexte = aide molettes

[imprimante.cal.aide_carte]
texte = Vingt-cinq mesures sur tout le plateau, enregistrées dans l'imprimante. Espace arrête.
contexte = aide carte


# --- nettoyage guide (2026-10-16) ---

[imprimante.net.titre]
texte = Nettoyage de l'imprimante.
contexte = titre du dialogue de nettoyage

[imprimante.net.consigne]
texte = Je te propose plusieurs méthodes ; tu choisis selon ce que tu as. Flèches haut et bas, ou un chiffre, pour parcourir ; I pour les détails et le matériel ; Entrée pour commencer. Pendant un nettoyage : Entrée passe à la consigne suivante, Espace arrête tout et coupe les chauffes, Échap revient à la liste. R répète, T donne les températures.
contexte = ouverture du nettoyage

[imprimante.net.liste]
texte = {n} méthodes : {noms}.
contexte = liste des méthodes

[imprimante.net.methode]
texte = Méthode {n} : {nom}.
contexte = titre d'une méthode

[imprimante.net.materiel_intro]
texte = Matériel, {n} choses :
contexte = avant la liste du matériel

[imprimante.net.materiel_aucun]
texte = Aucun matériel : il faut seulement du filament chargé dans l'imprimante.
contexte = purge

[imprimante.net.securite_chaud]
texte = Sécurité : la buse va chauffer à plus de 200 degrés. Ne touche jamais la partie métallique de la tête ni le plastique qui en sort. Je te dirai quand elle redevient touchable, sous 45 degrés. Espace coupe tout.
contexte = rappel sécurité à chaud

[imprimante.net.securite_froid]
texte = Sécurité : tout se fait à froid ; je vérifie d'abord que le plateau est froid. Garde les doigts hors de la surface une fois nettoyée.
contexte = rappel sécurité à froid

[imprimante.net.choisir]
texte = Entrée pour commencer si tu as tout, flèches pour une autre méthode.
contexte = fin des détails

[imprimante.net.touches_liste]
texte = Flèches haut et bas, ou un chiffre, pour choisir ; I pour les détails ; Entrée pour commencer ; L pour la liste ; Échap pour quitter.
contexte = touche inconnue dans la liste

[imprimante.net.entree_suite]
texte = Entrée quand c'est fait.
contexte = fin de consigne

[imprimante.net.methode_finie]
texte = Nettoyage terminé.
contexte = fin d'une méthode

[imprimante.net.methode_quittee]
texte = Nettoyage interrompu, chauffes coupées.
contexte = Échap pendant une méthode

[imprimante.net.chauffes_coupees]
texte = Chauffes coupées.
contexte = après Espace

[imprimante.net.chauffe_coupee_seule]
texte = Dix minutes sans suite : j'ai coupé la chauffe de la buse par sécurité.
contexte = garde-fou de chauffe

[imprimante.net.occupe]
texte = Nettoyage en cours.
contexte = tâche en cours

[imprimante.net.ferme]
texte = Nettoyage fermé. Chauffes coupées.
contexte = fin du dialogue

[imprimante.net.aide]
texte = Choisis une méthode selon ce que tu veux nettoyer et le matériel que tu as. Chaque consigne attend Entrée. Je surveille les températures et je te dis quand on peut toucher.
contexte = aide

[imprimante.net.aide_touches]
texte = Flèches ou chiffres : choisir. I : détails. Entrée : commencer ou continuer. Espace : tout arrêter. Échap : revenir à la liste, puis quitter. T : températures. R : répéter.
contexte = aide touches

[imprimante.net.nom.plateau_alcool]
texte = plateau à l'alcool
contexte = nom de méthode

[imprimante.net.nom.plateau_savon]
texte = plateau à l'eau savonneuse
contexte = nom de méthode

[imprimante.net.nom.plateau_grattage]
texte = plateau, reste de plastique collé
contexte = nom de méthode

[imprimante.net.nom.buse_papier]
texte = buse à chaud, papier tenu à la pince
contexte = nom de méthode

[imprimante.net.nom.buse_brosse]
texte = buse à chaud, brosse en laiton
contexte = nom de méthode

[imprimante.net.nom.buse_purge]
texte = buse, purge en poussant du plastique
contexte = nom de méthode

[imprimante.net.nom.buse_tirage]
texte = buse, tirage à froid
contexte = nom de méthode

[imprimante.net.resume.plateau_alcool]
texte = Dégraisse le verre : traces de doigts, colle, poussière. À froid, environ cinq minutes. À faire souvent, avant une impression qui n'accroche pas.
contexte = résumé

[imprimante.net.resume.plateau_savon]
texte = Lavage plus complet du verre quand l'alcool ne suffit plus. À froid, environ quinze minutes, séchage compris.
contexte = résumé

[imprimante.net.resume.plateau_grattage]
texte = Décolle un reste de plastique resté sur le verre. À froid, cinq minutes.
contexte = résumé

[imprimante.net.resume.buse_papier]
texte = Enlève le plastique collé autour de la pointe de la buse. À chaud, environ dix minutes avec la chauffe et le refroidissement.
contexte = résumé

[imprimante.net.resume.buse_brosse]
texte = Comme le papier, mais avec une brosse en laiton, plus efficace sur un dépôt brûlé. À chaud, environ dix minutes.
contexte = résumé

[imprimante.net.resume.buse_purge]
texte = Pousse cinq centimètres de plastique dans la buse chaude pour chasser un reste ancien ou une autre couleur. Sans matériel, dix minutes.
contexte = résumé

[imprimante.net.resume.buse_tirage]
texte = Nettoie l'intérieur de la buse quand le plastique sort mal : on fait fondre, puis on tire le filament à demi refroidi, il emporte les saletés. Environ quinze minutes, à refaire deux ou trois fois si besoin.
contexte = résumé

[imprimante.net.mat.alcool]
texte = Alcool isopropylique, ou alcool ménager ou de pharmacie à 70 ou 90 degrés : un flacon, odeur forte qui pique le nez. Pas d'alcool à brûler parfumé.
contexte = matériel

[imprimante.net.mat.essuie_tout]
texte = Essuie-tout en papier, ou un chiffon qui ne peluche pas.
contexte = matériel

[imprimante.net.mat.eau_savon]
texte = Un bol d'eau tiède avec quelques gouttes de liquide vaisselle, une éponge douce, le côté sans grattoir, et un torchon propre pour sécher.
contexte = matériel

[imprimante.net.mat.carte]
texte = Une vieille carte en plastique, comme une carte de fidélité : rigide, au bord droit et lisse. Jamais de lame métallique sur le verre.
contexte = matériel

[imprimante.net.mat.pince_longue]
texte = Une pince à becs longs : deux mâchoires fines qui se rejoignent en pointe, longue comme la main, pour tenir le papier loin des doigts. Une pince à épiler en métal peut dépanner.
contexte = matériel

[imprimante.net.mat.brosse_laiton]
texte = Une petite brosse à poils de laiton : poils métalliques fins et assez souples, plus doux que l'acier, avec un manche long comme un crayon. Pas de brosse en acier, trop dure pour la buse.
contexte = matériel

[imprimante.net.mat.filament]
texte = Environ trente centimètres de filament P.L.A. : un fil de plastique rigide, de la grosseur d'une mine de crayon, coupé net au bout.
contexte = matériel

[imprimante.net.mat.pince_plate]
texte = Une pince plate ou universelle, pour tenir fermement le filament et tirer d'un coup.
contexte = matériel

[imprimante.net.verifie_plateau]
texte = Je vérifie que le plateau est froid.
contexte = début plateau

[imprimante.net.plateau_refroidit]
texte = Plateau à {t} degrés, il refroidit.
contexte = attente plateau froid

[imprimante.net.plateau_ok_froid]
texte = Plateau froid.
contexte = plateau froid

[imprimante.net.tete_place]
texte = Il faut de la place sous la buse : pose la main à plat sur le plateau, sous la tête. Il faut au moins la hauteur de ta main. Entrée si c'est le cas ; sinon H fait monter la tête de trois centimètres.
contexte = place sous la buse

[imprimante.net.plateau_vient]
texte = Mouvement lancé, ne touche pas l'imprimante. Le plateau vient vers toi.
contexte = plateau qui avance

[imprimante.net.plateau_devant]
texte = Le plateau est devant, il ne bouge plus.
contexte = plateau avancé

[imprimante.net.plateau_fin]
texte = Laisse sécher une minute. Ensuite, ne touche plus la surface : tiens le verre par les bords seulement.
contexte = fin plateau

[imprimante.net.alcool_1]
texte = Imbibe un morceau d'essuie-tout d'alcool, sans qu'il goutte.
contexte = plateau alcool

[imprimante.net.alcool_2]
texte = Frotte tout le verre par bandes, de l'arrière vers l'avant, en appuyant un peu. Insiste dans les coins et le long des bords.
contexte = plateau alcool

[imprimante.net.alcool_3]
texte = Prends un essuie-tout propre et sec, et repasse sur tout le verre pour enlever ce que l'alcool a dissous.
contexte = plateau alcool

[imprimante.net.savon_1]
texte = Si tu peux, retire le verre : il est tenu par des pinces sur les bords, des pinces à dessin en métal avec deux ailettes. Presse les ailettes pour ouvrir chaque pince. Sinon, lave-le en place avec une éponge à peine humide.
contexte = plateau savon

[imprimante.net.savon_2]
texte = Lave toute la face du dessus à l'éponge douce, avec l'eau savonneuse tiède.
contexte = plateau savon

[imprimante.net.savon_3]
texte = Rince à l'eau claire, pour qu'il ne reste pas de savon, qui empêcherait l'accroche.
contexte = plateau savon

[imprimante.net.savon_4]
texte = Sèche entièrement avec le torchon propre, puis remets le verre, face lavée dessus, et referme les pinces sur les bords.
contexte = plateau savon

[imprimante.net.grattage_1]
texte = Cherche du bout des doigts le reste de plastique : une petite bosse dure sur le verre lisse.
contexte = grattage

[imprimante.net.grattage_2]
texte = Tiens la carte presque à plat, et pousse doucement son bord sous le reste de plastique pour le décoller. Puis passe un essuie-tout pour enlever les miettes.
contexte = grattage

[imprimante.net.chaud_avant]
texte = Prépare ton matériel à portée de main. Je vais chauffer la buse. À partir de maintenant, ne touche plus la partie métallique de la tête.
contexte = avant chauffe

[imprimante.net.chauffe_lancee]
texte = La buse chauffe jusqu'à {t} degrés. Je t'annonce la température.
contexte = chauffe lancée

[imprimante.net.chauffe]
texte = Buse à {t} degrés.
contexte = progression de la chauffe

[imprimante.net.buse_chaude]
texte = La buse est à {t} degrés.
contexte = buse chaude

[imprimante.net.papier_1]
texte = Plie un essuie-tout en petit carré épais et tiens-le avec la pince, par un coin. Approche-le de la pointe de la buse, par-dessous, sans jamais approcher les doigts.
contexte = buse papier

[imprimante.net.papier_2]
texte = Frotte doucement la pointe de la buse avec le papier, trois ou quatre fois, en tournant autour. Le plastique fondu reste sur le papier. Pose ensuite le papier sur le plateau, il est chaud.
contexte = buse papier

[imprimante.net.brosse_1]
texte = Tiens la brosse par le bout du manche. Approche les poils de la pointe de la buse, par-dessous, sans approcher les doigts.
contexte = buse brosse

[imprimante.net.brosse_2]
texte = Brosse doucement la pointe et les côtés de la buse, par petits mouvements, une dizaine de fois. N'appuie pas fort.
contexte = buse brosse

[imprimante.net.purge_avant]
texte = Il faut du filament chargé dans l'imprimante. Je vais chauffer la buse puis pousser cinq centimètres de plastique : il sortira par la pointe en un fil chaud, ne le touche pas avant que je te le dise.
contexte = avant purge

[imprimante.net.centrage]
texte = Mouvement lancé, ne touche pas l'imprimante. La tête va aux butées gauche et fond, puis au-dessus du centre du plateau.
contexte = centrage lancé

[imprimante.net.centre]
texte = La buse est au-dessus du centre du plateau.
contexte = centrage fait

[imprimante.net.plateau_revient]
texte = Mouvement lancé, ne touche pas l'imprimante. Le plateau revient au centre.
contexte = plateau recentré

[imprimante.net.plateau_recentre]
texte = Le plateau est revenu au centre.
contexte = plateau recentré

[imprimante.net.purge_lancee]
texte = Le plastique sort de la buse.
contexte = purge lancée

[imprimante.net.purge_faite]
texte = Purge faite.
contexte = purge finie

[imprimante.net.purge_apres]
texte = Le fil de plastique sorti peut rester là ; tu l'enlèveras quand la buse sera froide.
contexte = après purge

[imprimante.net.refroidir_lance]
texte = Je coupe la chauffe et j'attends que la buse refroidisse, sous 45 degrés.
contexte = refroidissement lancé

[imprimante.net.refroidit]
texte = Buse à {t} degrés, elle refroidit.
contexte = progression du refroidissement

[imprimante.net.touchable]
texte = La buse est sous 45 degrés : tu peux à nouveau toucher la tête.
contexte = buse touchable

[imprimante.net.tirage_avant]
texte = Retire le filament s'il y en a un, et garde ton bout de trente centimètres à portée de main. Je chauffe la buse à 220 degrés, assez pour faire fondre le P.L.A. sans abîmer le tube intérieur de ta tête d'origine.
contexte = avant tirage

[imprimante.net.tirage_pousser]
texte = Sur le côté gauche du cadre, l'extrudeur : un levier en plastique ou en métal, contre un ressort. Appuie sur le levier pour le libérer, et enfonce le filament par le trou du dessus, jusqu'à sentir une résistance, puis pousse encore : quand il avance plus facilement, le plastique fondu sort de la buse.
contexte = tirage pousser

[imprimante.net.coupe_et_pousse]
texte = Je coupe la chauffe. Continue à pousser fermement le filament pendant que la buse refroidit.
contexte = tirage refroidissement

[imprimante.net.refroidit_pousse]
texte = Buse à {t} degrés : continue de pousser.
contexte = tirage refroidissement

[imprimante.net.lache]
texte = Tu peux arrêter de pousser et lâcher le filament. Garde la pince à portée de main ; j'attends 90 degrés.
contexte = tirage lâcher

[imprimante.net.attends_tirer]
texte = J'attends que la buse descende à 90 degrés.
contexte = attente tirage

[imprimante.net.tire_maintenant]
texte = 90 degrés : tire maintenant ! Appuie sur le levier, prends le filament avec la pince, et tire d'un coup ferme et régulier, tout droit vers le haut.
contexte = tirer

[imprimante.net.tirage_apres]
texte = Touche le bout du filament que tu as sorti : il doit avoir la forme pointue de la buse. Si tu sens des grains ou un dépôt, c'est la saleté retirée ; tu pourras recommencer la méthode pour un deuxième passage.
contexte = après tirage


# --- chargement guide (2026-10-16) ---

[imprimante.charge.titre]
texte = Chargement du filament.
contexte = titre du dialogue

[imprimante.charge.consigne]
texte = Je te guide pour changer de filament et vérifier qu'il coule bien avant d'imprimer. Flèches haut et bas, ou un chiffre, pour choisir le matériau ; I pour les détails ; Entrée pour commencer. Espace arrête tout et coupe la chauffe, Échap revient à la liste.
contexte = ouverture

[imprimante.charge.liste]
texte = Matériaux : {noms}. Actuellement enregistré : {actuel}.
contexte = liste des matériaux

[imprimante.charge.materiau]
texte = Matériau {n} : {nom} ;
contexte = titre d'un matériau

[imprimante.charge.resume]
texte = Buse à {buse} degrés, plateau à {plateau}.
contexte = températures du matériau

[imprimante.charge.toucher.PLA]
texte = Au toucher : fil rigide, il casse net si on le plie fort.
contexte = PLA au toucher

[imprimante.charge.toucher.PETG]
texte = Au toucher : un peu plus souple que le P.L.A., il plie sans casser, surface lisse.
contexte = PETG au toucher

[imprimante.charge.toucher.ABS]
texte = Au toucher : rigide et léger ; en chauffant il sent fort le plastique brûlé.
contexte = ABS au toucher

[imprimante.charge.toucher.TPU]
texte = Au toucher : souple comme du caoutchouc, il s'étire et se tord.
contexte = TPU au toucher

[imprimante.charge.prudence.PLA]
texte = Le plus facile, idéal pour commencer.
contexte = PLA

[imprimante.charge.prudence.PETG]
texte = Il chauffe à 240 degrés, la limite de ta tête d'origine : pas plus. Il colle très fort au verre, laisse refroidir le plateau avant de décoller une pièce.
contexte = PETG

[imprimante.charge.prudence.ABS]
texte = Il chauffe à 240 degrés, la limite de ta tête d'origine, et son plateau à 100. Il dégage des vapeurs : aère la pièce. Sans caisson fermé, il se déforme souvent.
contexte = ABS

[imprimante.charge.prudence.TPU]
texte = Délicat sur ton imprimante : le fil souple se tord dans le long tube blanc. Pousse-le très doucement au chargement, et imprime lentement.
contexte = TPU

[imprimante.charge.materiel]
texte = Matériel : ta bobine, et une pince coupante ou des ciseaux pour couper le bout du fil.
contexte = matériel

[imprimante.charge.aide]
texte = L'assistant retire l'ancien filament, t'aide à charger le nouveau, vérifie qu'il coule bien, et enregistre le matériau pour les impressions.
contexte = aide

[imprimante.charge.q_ancien]
texte = Y a-t-il déjà un filament dans l'imprimante ? Il entre par le dessus de l'extrudeur, sur le côté gauche du cadre. Entrée : oui, il faut le retirer. N : non, l'extrudeur est vide.
contexte = question ancien filament

[imprimante.charge.retrait_avant]
texte = La buse est assez chaude pour libérer l'ancien filament. Je vais d'abord pousser un centimètre pour ramollir le bout, puis le faire reculer de huit centimètres.
contexte = avant recul

[imprimante.charge.recul_lance]
texte = Le filament recule.
contexte = recul lancé

[imprimante.charge.recul_fait]
texte = Recul fait.
contexte = recul fini

[imprimante.charge.retrait_main]
texte = Appuie légèrement sur le levier de l'extrudeur, sans forcer, et tire doucement le filament vers toi jusqu'à ce qu'il sorte complètement. S'il résiste, ne tire pas fort : dis-le moi.
contexte = retrait à la main

[imprimante.charge.ancien_range]
texte = Coupe le bout abîmé de l'ancien fil, puis glisse son extrémité dans un des petits trous du bord de la bobine, pour qu'elle ne se déroule pas. Range la bobine.
contexte = ranger l'ancienne

[imprimante.charge.bobine_place]
texte = Pose la nouvelle bobine sur son support, en haut du cadre. Le fil doit partir de la bobine vers l'extrudeur sans croiser d'autres spires : tourne la bobine pour que le fil se déroule librement.
contexte = bobine

[imprimante.charge.bout_coupe]
texte = Coupe le bout du fil en biais, pour faire une pointe. Puis redresse les dix premiers centimètres entre tes doigts.
contexte = bout en pointe

[imprimante.charge.inserer_1]
texte = Appuie légèrement sur le levier de l'extrudeur et enfonce le fil dans le petit trou du dessus. Il passe entre les roues et entre dans le tube blanc souple.
contexte = insérer

[imprimante.charge.inserer_2]
texte = Garde le levier appuyé et pousse le fil dans le tube, environ quarante centimètres, jusqu'à sentir une résistance : il touche la buse. Pousse encore doucement : quand il avance plus facilement, le plastique sort de la buse. Lâche alors le levier.
contexte = pousser jusqu'à la buse

[imprimante.charge.centrage]
texte = Mouvement lancé, ne touche pas l'imprimante. La tête va aux butées gauche et fond, puis au-dessus du centre du plateau.
contexte = centrage lancé

[imprimante.charge.centre]
texte = La buse est au-dessus du centre du plateau.
contexte = centrage fait

[imprimante.charge.plafond]
texte = Déjà {mm} millimètres poussés sans que tu sentes le plastique sortir : je ne pousse plus. Si rien ne sort, appuie sur Z.
contexte = plafond de purge

[imprimante.charge.rien_ne_sort]
texte = Rien ne sort après {mm} millimètres poussés par le moteur : le plastique va ailleurs, ou la buse est bouchée. J'arrête et je coupe la chauffe. Quand la buse sera froide, je te le dirai : suis le tube blanc de l'extrudeur jusqu'à la tête et cherche une boucle de fil qui sort ; vérifie que le tube est bien enfoncé dans ses raccords, en haut de la tête et à la sortie de l'extrudeur ; et cherche une masse de plastique durci autour du bloc métallique au-dessus de la buse. Ne relance pas de chargement avant d'avoir trouvé.
contexte = rien ne sort

[imprimante.charge.purge_lancee]
texte = Je pousse {mm} millimètres. Écoute l'extrudeur, et ne touche pas le plastique qui sort.
contexte = purge lancée

[imprimante.charge.purge_faite]
texte = {mm} millimètres poussés.
contexte = purge finie

[imprimante.charge.q_ecoulement]
texte = Vérification de l'écoulement. Pendant la poussée, l'extrudeur doit faire un bruit doux et régulier. Attends dix secondes, puis touche le fil sorti sous la buse, pas la buse : il doit être lisse, régulier, de la couleur du nouveau filament. Entrée : tout est bon. P : pousser encore trois centimètres. Z : rien ne sort. C : j'ai entendu claquer. B : j'ai entendu crépiter, ou senti des bulles.
contexte = question écoulement

[imprimante.charge.claquements]
texte = Des claquements, c'est l'extrudeur qui saute : la buse est trop froide pour ce matériau, partiellement bouchée, ou le fil frotte. Vérifie que la bobine tourne librement. Si ça continue, le tirage à froid de l'assistant de nettoyage débouchera la buse. P pour réessayer, Entrée pour continuer quand même.
contexte = claquements

[imprimante.charge.crepitements]
texte = Des crépitements ou des bulles, c'est un filament humide : l'eau bout dans la buse. Il faut le sécher, par exemple au four ou dans un sécheur, vers {t} degrés pendant quatre à six heures, puis le garder dans un sac fermé avec un sachet déshydratant. P pour réessayer, Entrée pour continuer quand même.
contexte = crépitements

[imprimante.charge.q_debit]
texte = Vérification facultative du débit : on contrôle que l'extrudeur pousse bien la longueur demandée. Il faut un morceau de ruban adhésif et ton mètre. V pour la faire, Entrée pour passer.
contexte = question débit

[imprimante.charge.debit_repere]
texte = Mesure sur le fil, à partir du petit trou du dessus de l'extrudeur, douze centimètres vers la bobine, et colle un petit morceau de ruban adhésif à cet endroit, serré sur le fil. Entrée quand le repère est posé.
contexte = poser le repère

[imprimante.charge.debit_lance]
texte = Je pousse dix centimètres très lentement, environ une minute quarante. Ne touche à rien.
contexte = débit lancé

[imprimante.charge.debit_progres]
texte = Poussée en cours, {s} secondes.
contexte = progression débit

[imprimante.charge.debit_mesure]
texte = Mesure maintenant l'écart entre le petit trou de l'extrudeur et le ruban adhésif, en millimètres. Tape le nombre, puis Entrée.
contexte = mesure du reste

[imprimante.charge.debit_aberrant]
texte = D'après ta mesure, {reel} millimètres auraient été poussés au lieu de cent : c'est trop loin pour être juste. Je ne change rien ; on pourra refaire la vérification.
contexte = mesure aberrante

[imprimante.charge.debit_sans_e]
texte = Je n'arrive pas à lire le réglage actuel de l'extrudeur. Je ne change rien.
contexte = M92 illisible

[imprimante.charge.debit_bon]
texte = {reel} millimètres poussés pour cent demandés : le débit est juste, rien à changer.
contexte = débit juste

[imprimante.charge.debit_resultat]
texte = {reel} millimètres poussés pour cent demandés. Le réglage de l'extrudeur passerait de {ancien} à {e} pas par millimètre. Entrée pour l'enregistrer, N pour garder l'ancien.
contexte = proposition débit

[imprimante.charge.debit_propose]
texte = Nouveau réglage proposé : {e}. Entrée pour l'enregistrer, N pour garder l'ancien.
contexte = rappel proposition

[imprimante.charge.debit_enregistre]
texte = Enregistré : {e} pas par millimètre.
contexte = débit enregistré

[imprimante.charge.debit_garde]
texte = Ancien réglage gardé.
contexte = débit gardé

[imprimante.charge.enregistre]
texte = Matériau enregistré, {nom} : les impressions utiliseront ses températures.
contexte = matériau enregistré

[imprimante.charge.q_chaleur]
texte = Le filament est chargé. G : garder la buse chaude pour lancer une impression tout de suite ; elle sera coupée au bout de dix minutes si rien ne démarre. Entrée : couper la chauffe.
contexte = question chaleur

[imprimante.charge.garde_chaud]
texte = Je garde la buse chaude.
contexte = garder chaud

[imprimante.charge.chauffe_coupee]
texte = Chauffe coupée.
contexte = chauffe coupée

[imprimante.charge.fini]
texte = Chargement terminé. Tu peux lancer une impression. Échap pour quitter.
contexte = fin

[imprimante.charge.quitte]
texte = Chargement interrompu, chauffe coupée.
contexte = Échap pendant le chargement

[imprimante.charge.ferme]
texte = Chargement fermé. Chauffe coupée.
contexte = fin du dialogue

[imprimante.charge.ferme_chaud]
texte = Chargement fermé. La buse reste chaude dix minutes pour ton impression.
contexte = fin du dialogue, buse chaude

