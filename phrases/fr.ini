# Phrases de l'interface du Pi, en francais : VERSION NEUTRE de reference.
#
# Une section par phrase : [domaine.nom]
#   texte     la phrase, avec ses variables entre accolades : {nom}
#   contexte  quand elle est dite (guide la reecriture par la personnalite)
#   garder    mots qui doivent rester tels quels, separes par des virgules
#             (noms de touches, commandes a taper)
#   fixe      oui = jamais reecrite par la personnalite
# Les nombres arrivent deja accordes ("1 note", "5 notes").
# Une autre langue : un autre fichier (en.ini...) avec les memes sections.
# Ce fichier n'est jamais modifie par le Pi ; la personnalite du jour est
# ecrite a part (lib/personnalite.py).

# --- navigation commune (journal, archives) ---

[nav.premier_jour]
texte = Premier du jour.
contexte = Ctrl + flèche haut : on saute au premier enregistrement du jour

[nav.dernier_jour]
texte = Dernier du jour.
contexte = Ctrl + flèche bas : on saute au dernier enregistrement du jour

[nav.debut_journee]
texte = Début de la journée.
contexte = flèche haut alors qu'on est déjà sur le premier enregistrement

[nav.fin_journee]
texte = Fin de la journée.
contexte = flèche bas alors qu'on est déjà sur le dernier enregistrement

[nav.jour]
texte = {jour}, {elements}.
contexte = annonce du jour choisi et de son nombre d'éléments, par exemple « vendredi 2 octobre, 12 enregistrements »

# --- journal ---

[journal.titre]
texte = Journal {nom}.
contexte = ouverture du journal ; nom vaut radio, données, capteurs ou satellites

[journal.consigne]
texte = Tab et majuscule tab : changer de jour. Flèches haut et bas : écouter les enregistrements. Contrôle flèche haut ou bas : premier ou dernier du jour. Alt flèche haut ou bas : entrée précédente ou suivante pas encore notée. Flèche droite : garder. Flèche gauche : rejeter comme parasite ; sur un message DAB, interdit aussi sa station. V : valider, bonne prise. N : noter en détail. B : écouter le son brut, avant nettoyage. E : envoyer à l'examen de l'IA du Mac. I : informations. Entrée : rejouer. Échap : fermer. F1 redit ces touches.
contexte = consigne des touches du journal, dite à l'ouverture ou avec F1
garder = Tab, majuscule tab, Flèches haut et bas, Contrôle, Flèche droite, Flèche gauche, V, N, B, E, I, Entrée, Échap, F1

[journal.consigne_capteurs]
texte = Tab et majuscule tab : changer de jour. Flèches haut et bas : un relevé par capteur, et les annonces. Contrôle flèche haut ou bas : premier ou dernier du jour. Alt flèche haut ou bas : entrée précédente ou suivante pas encore notée. Flèche droite : garder. Entrée : relire. Échap : fermer. F1 redit ces touches.
contexte = consigne des touches du journal des capteurs
garder = Tab, majuscule tab, Flèches haut et bas, Contrôle, Flèche droite, Entrée, Échap, F1

[journal.aide_courte]
texte = Tab, flèches, V, N, entrée, ou échap pour fermer. F1 pour l'aide.
contexte = touche inconnue dans le journal
garder = Tab, V, N, F1

[journal.disque_absent]
texte = Le disque server n'est pas accessible, pas de journal {nom}.
contexte = le disque du NAS est absent à l'ouverture du journal
garder = server

[journal.vide]
texte = Le journal {nom} est vide.
contexte = aucun enregistrement dans ce journal

[journal.ferme]
texte = Journal {nom} fermé.
contexte = fermeture du journal

[journal.choisir]
texte = Choisis d'abord un enregistrement avec la flèche bas.
contexte = une touche d'action est pressée avant d'avoir choisi un enregistrement

[journal.garde]
texte = Gardé.
contexte = l'enregistrement est copié dans les archives

[journal.deja_garde]
texte = Déjà gardé.
contexte = l'enregistrement était déjà dans les archives

[journal.rejete_appris]
texte = Rejeté, empreinte apprise.
contexte = l'enregistrement est supprimé et son bruit appris comme parasite

[journal.rejete_supprime]
texte = Rejeté et supprimé. Pas d'empreinte sonore pour celui-ci, je ne peux pas l'apprendre.
contexte = l'enregistrement est supprimé mais rien n'a pu être appris

[journal.plus_rien]
texte = Plus aucun enregistrement.
contexte = après un rejet, le journal est vide

[journal.journee_vide]
texte = Journée vide.
contexte = après un rejet, ce jour ne contient plus rien

[journal.releve]
texte = C'est un relevé de capteurs.
contexte = touche I sur un relevé de capteurs, qui n'a pas d'informations radio

[journal.releve_non_notable]
texte = Un relevé de capteurs ne se rejette pas et ne se note pas : flèche droite pour le garder.
contexte = touche de rejet ou de note sur un relevé de capteurs
garder = flèche droite

[journal.son_brut]
texte = Son brut.
contexte = touche B : on va entendre le son avant nettoyage

[journal.pas_son_brut]
texte = Pas de son brut pour celui-ci : seules les nouvelles écoutes du scanner en ont un.
contexte = touche B sur un enregistrement sans son brut

[journal.pas_info]
texte = Pas d'informations radio pour celui-ci.
contexte = touche I sur un enregistrement sans fréquence connue

[journal.info]
texte = {frequence} mégahertz, {mode}, {libelle}.
contexte = touche I : fréquence, mode et bande de l'enregistrement

[journal.info_analyse]
texte = Signal de {largeur} kilohertz de large, baisse de {baisse} décibels pour 10 de gain en moins : {verdict}.
contexte = touche I sur une capture en ondes courtes : le verdict dit si c'est une vraie émission ou un artefact

# --- archives ---

[archives.titre]
texte = Archives {nom}, lecture seule.
contexte = ouverture des archives ; rien n'y est jamais supprimé

[archives.consigne]
texte = Tab et majuscule tab : changer de jour. Flèches haut et bas : écouter. Contrôle flèche haut ou bas : premier ou dernier du jour. Alt flèche haut ou bas : entrée précédente ou suivante pas encore notée. Gauche et droite : volume. Entrée : rejouer. Échap : fermer. F1 redit ces touches.
contexte = consigne des touches des archives
garder = Tab, majuscule tab, Flèches haut et bas, Contrôle, Gauche et droite, Entrée, Échap, F1

[archives.aide_courte]
texte = Tab, flèches, entrée, ou échap pour fermer. F1 pour l'aide.
contexte = touche inconnue dans les archives
garder = Tab, F1

[archives.disque_absent]
texte = Le disque de stockage n'est pas accessible, pas d'archives.
contexte = le second disque du NAS est absent

[archives.vide]
texte = Aucune archive {nom} pour l'instant.
contexte = rien n'a encore été gardé dans ces archives

[archives.ferme]
texte = Archives {nom} fermées.
contexte = fermeture des archives

[archives.choisir]
texte = Choisis d'abord un extrait avec la flèche bas.
contexte = entrée pressée avant d'avoir choisi un extrait

[archives.volume]
texte = Volume {pourcent} pour cent.
contexte = réglage du volume de lecture des archives

# --- notation ---

[notation.titre]
texte = Notation.
contexte = ouverture de la grille de notation d'un enregistrement

[notation.consigne]
texte = Flèches haut et bas : champ. Gauche et droite : valeur. E ou F2 : écouter l'exemple de référence de la valeur choisie. Entrée sur OK pour enregistrer. Échap : annuler. F1 redit ces touches.
contexte = consigne des touches de la grille de notation
garder = Flèches haut et bas, Gauche et droite, E, F2, Entrée, OK, Échap, F1

[notation.aide_courte]
texte = Flèches, E pour l'exemple, entrée sur OK, ou échap. F1 pour l'aide.
contexte = touche inconnue dans la notation
garder = E, OK, F1

[notation.ok]
texte = OK, entrée pour enregistrer.
contexte = le curseur est sur la ligne OK de la grille
garder = OK

[notation.descends_ok]
texte = Descends jusqu'à OK pour enregistrer.
contexte = entrée pressée ailleurs que sur OK
garder = OK

[notation.deja_note_modif]
texte = Déjà noté, tu modifies la note.
contexte = on rouvre la grille d'un enregistrement déjà noté

[notation.annulee]
texte = Notation annulée.
contexte = échap dans la grille de notation

[notation.enregistree]
texte = Note enregistrée. {total} au total.
contexte = la note est sauvée ; total vaut par exemple « 12 notes »

[notation.valide]
texte = Validé, bonne prise. {total} au total.
contexte = touche V dans le journal : la prise est notée parfaite

[notation.deja_valide]
texte = Déjà validé.
contexte = touche V sur une prise déjà validée

[notation.deja_note]
texte = Déjà noté en détail : N pour modifier la note.
contexte = touche V sur une prise déjà notée en détail
garder = N

[notation.disque_absent]
texte = Le disque server n'est pas accessible, notation impossible.
contexte = le disque du NAS est absent
garder = server

[notation.disque_absent_validation]
texte = Le disque server n'est pas accessible, validation impossible.
contexte = touche V alors que le disque du NAS est absent
garder = server

[notation.station_notee]
texte = Station probable notée : le scanner s'y recentrera et y reviendra.
contexte = une prise parfaite crée une station probable

[notation.choisir_champ]
texte = Choisis d'abord un champ.
contexte = demande d'exemple alors que le curseur est sur OK

[notation.exemple]
texte = Exemple : {champ}, {valeur}.
contexte = annonce avant de jouer l'exemple sonore d'une valeur

[notation.exemple_type]
texte = Exemple : {champ}.
contexte = annonce avant de jouer l'exemple sonore d'un type de brouillage

[notation.pas_exemple_avis]
texte = Pas d'exemple pour {champ} : c'est ton avis.
contexte = pas d'exemple sonore pour un champ qui relève du jugement personnel

[notation.pas_exemple]
texte = Pas d'exemple pour {champ} {valeur}.
contexte = exemple sonore manquant

# --- mode manuel ---

[manuel.titre]
texte = Mode manuel, balayage suspendu.
contexte = ouverture du mode manuel : le scanner arrête de balayer

[manuel.consigne]
texte = Flèches haut et bas : changer de plage ; en tête, les stations repérées. Gauche et droite : ajuster la fréquence, ou passer d'une station repérée à l'autre. Page haut et page bas : dix pas. F : filtre et silencieux. O : activer ou désactiver la station repérée. F3 : renommer la station repérée. A : ajouter une station. Suppr : retirer la station repérée. V : bonne réception, comme dans le journal. Entrée : relire. Échap : fermer. F1 redit ces touches.
contexte = consigne des touches du mode manuel
garder = Flèches haut et bas, Gauche et droite, Page haut, page bas, F, O, F3, A, Suppr, V, Entrée, Échap, F1

[manuel.aide_courte]
texte = Flèches, F, O, F3, A, V, entrée, ou échap pour fermer. F1 pour l'aide.
contexte = touche inconnue en mode manuel
garder = F, O, F3, A, V, F1

[manuel.plages_absentes]
texte = Le scanner radio n'a pas publié sa liste de plages. Vérifie qu'il tourne.
contexte = le mode manuel ne peut pas s'ouvrir

[manuel.ferme]
texte = Mode manuel fermé. Le scanner reste fixé sur {position}. Tape décroche pour reprendre le balayage.
contexte = fermeture du mode manuel, le scanner reste sur la fréquence
garder = décroche

[manuel.filtre_off]
texte = Filtre désactivé.
contexte = touche F : retour à l'écoute brute

[manuel.filtre_on]
texte = Filtre activé.
contexte = touche F : filtre et silencieux comme le scanner

[manuel.filtre_fm]
texte = Filtre activé, mais sans effet sur la radio FM.
contexte = touche F sur la radio FM, où il n'y a pas de silencieux

[manuel.filtre_actif]
texte = filtre activé
contexte = ajouté à la relecture de la fréquence quand le filtre est actif

[manuel.debut_plage]
texte = Début de plage, {suite}
contexte = on bute sur le bas de la plage ; suite est la fréquence

[manuel.fin_plage]
texte = Fin de plage, {suite}
contexte = on bute sur le haut de la plage ; suite est la fréquence

[manuel.debut_liste]
texte = Début de la liste, {suite}
contexte = on bute sur la première station repérée

[manuel.fin_liste]
texte = Fin de la liste, {suite}
contexte = on bute sur la dernière station repérée

[manuel.station]
texte = station repérée {numero} sur {total}, {frequence}, {mode}, {bande}
contexte = description d'une station repérée sous le curseur

[manuel.habitude]
texte = souvent le {jour} vers {heure} heures
contexte = ajouté à la description d'une station qui émet à heure fixe

[manuel.station_activee]
texte = Station {frequence} activée : le scanner y repasse.
contexte = touche O en mode manuel, station repérée remise en service

[manuel.station_desactivee]
texte = Station {frequence} désactivée : le scanner n'y passe plus. O pour la réactiver.
contexte = touche O en mode manuel, station repérée mise hors service
garder = O

[manuel.station_etat_desactivee]
texte = désactivée
contexte = manuel.py, état d'une station repérée que le scanner ne visite plus

[manuel.pas_une_station]
texte = O active ou désactive une station repérée : flèche haut jusqu'aux stations repérées.
contexte = touche O en mode manuel hors de la liste des stations repérées
garder = O

[manuel.station_introuvable]
texte = Station introuvable dans la liste, rien n'a changé.
contexte = touche O en mode manuel, station disparue du fichier

[manuel.renommer_consigne]
texte = Nom de la station {frequence}, actuellement {actuel}. Tape le nouveau nom puis Entrée. Entrée seule : inchangé. Aucun : retirer le nom.
contexte = touche F3 en mode manuel, saisie du nom d'une station repérée
garder = Entrée, Aucun

[manuel.sans_nom]
texte = sans nom
contexte = manuel.py, station repérée qui n'a pas encore de nom

[manuel.station_renommee]
texte = Station {frequence} renommée {nom}.
contexte = touche F3 en mode manuel, nom enregistré

[manuel.nom_retire]
texte = Nom retiré pour la station {frequence}.
contexte = touche F3 en mode manuel, nom effacé

[manuel.nom_inchange]
texte = Nom inchangé.
contexte = touche F3 en mode manuel, saisie vide

[manuel.renommer_pas_une_station]
texte = F3 renomme une station repérée : flèche haut jusqu'aux stations repérées.
contexte = touche F3 en mode manuel hors de la liste des stations repérées
garder = F3

[manuel.ajout_frequence]
texte = Nouvelle station. Tape la fréquence en mégahertz, par exemple 129,6, puis Entrée. Entrée seule : annuler.
contexte = touche A en mode manuel, saisie de la fréquence
garder = Entrée

[manuel.ajout_frequence_invalide]
texte = Fréquence non comprise, entre 24 et 1766 mégahertz. Rien n'est ajouté.
contexte = touche A en mode manuel, fréquence illisible ou hors de portée de la clé

[manuel.ajout_annule]
texte = Ajout annulé.
contexte = touche A en mode manuel, abandon

[manuel.ajout_mode]
texte = {frequence}. Modulation : {mode}. Flèches gauche et droite pour changer, Entrée pour valider, Échap pour annuler.
contexte = touche A en mode manuel, choix de la modulation
garder = Entrée, Échap

[manuel.ajout_mode_aide]
texte = Flèches gauche et droite, puis Entrée.
contexte = touche A en mode manuel, touche inattendue pendant le choix de la modulation
garder = Entrée

[manuel.ajout_nom]
texte = Nom de la station, puis Entrée. Entrée seule : sans nom.
contexte = touche A en mode manuel, saisie du nom
garder = Entrée

[manuel.station_ajoutee]
texte = Station {frequence} ajoutée.
contexte = touche A en mode manuel, station créée

[manuel.station_deja_la]
texte = Une station repérée existe déjà à {frequence}, je m'y place.
contexte = touche A en mode manuel, station déjà connue tout près

[manuel.suppr_confirmer]
texte = Retirer la station {frequence} ? Tape oui puis Entrée.
contexte = touche Suppr en mode manuel, confirmation
garder = oui, Entrée

[manuel.suppr_annule]
texte = Rien n'est retiré.
contexte = touche Suppr en mode manuel, pas de confirmation

[manuel.station_retiree]
texte = Station {frequence} retirée.
contexte = touche Suppr en mode manuel, station supprimée

[manuel.suppr_pas_une_station]
texte = Suppr retire une station repérée : flèche haut jusqu'aux stations repérées.
contexte = touche Suppr en mode manuel hors de la liste des stations repérées
garder = Suppr

[manuel.valide]
texte = Validé, bonne réception. {total} au total.
contexte = touche V en mode manuel

# --- appairage ---

[appairage.titre]
texte = Appairage d'une machine compagne.
contexte = ouverture de l'appairage avec un Mac ou un PC qui calculera pour le Pi

[appairage.consigne]
texte = Sur l'autre machine, ouvre Nearfield Bridge et choisis appairer avec un Pi. Quand elle répond, vérifie qu'elle affiche le même code, puis valide d'un seul côté : Entrée ici, ou Oui sur la machine. Échap : annuler. F1 redit ces consignes.
contexte = consigne de l'appairage
garder = Nearfield Bridge, Entrée, Oui, Échap, F1

[appairage.attente]
texte = J'attends la machine.
contexte = l'appairage est lancé, en attente de la réponse de l'autre machine

[appairage.reponse]
texte = La machine {nom} répond. Code : {code}. Elle sait faire : {capacites}. Si c'est le même code, Entrée ici ou Oui sur la machine ; sinon Échap.
contexte = l'autre machine a répondu ; le code doit être identique des deux côtés
garder = Entrée, Oui, Échap

[appairage.delai]
texte = Aucune machine n'a répondu en trois minutes. Échap pour fermer.
contexte = personne n'a répondu
garder = Échap

[appairage.reussi]
texte = Machine {nom} appairée : nos clés sont échangées. Elle se connectera au Pi et calculera pour lui ; dis compagnon pour son état.
contexte = appairage réussi
garder = compagnon

[appairage.valide_ailleurs]
texte = Code validé sur la machine.
contexte = la personne a validé sur l'autre machine, le Pi suit tout seul

[appairage.refus]
texte = La machine a refusé : les codes ne correspondaient pas. Rien n'est enregistré.
contexte = la personne a refusé sur l'autre machine

[appairage.annule]
texte = Appairage annulé.
contexte = échap pendant l'appairage

[appairage.pas_reponse]
texte = Pas encore de réponse.
contexte = entrée pressée avant que la machine réponde

[appairage.personne]
texte = Personne n'a répondu. Échap.
contexte = entrée pressée après le délai
garder = Échap

[appairage.aide_courte]
texte = Entrée pour accepter quand la machine a répondu, Échap pour annuler.
contexte = touche inconnue pendant l'appairage
garder = Entrée, Échap

[appairage.ferme]
texte = Appairage fermé.
contexte = fin du dialogue d'appairage

# --- personnalite (commande "personnalité") ---

[personnalite.etat]
texte = Personnalité du Pi : {description}.
contexte = la commande personnalité dit la personnalité en place
fixe = oui

[personnalite.neutre]
texte = ton neutre, celui d'origine
contexte = description quand aucune personnalité n'est active
fixe = oui

[personnalite.demande]
texte = Tape la personnalité que tu veux, en quelques mots ou en quelques phrases. Neutre pour revenir au ton d'origine, surprise pour en laisser inventer une chaque nuit, entrée seule pour ne rien changer.
contexte = invite à écrire la personnalité
garder = Neutre, surprise, entrée
fixe = oui

[personnalite.enregistree]
texte = Personnalité enregistrée. Le Pi réécrira ses phrases cette nuit à minuit. Tape oui pour qu'il le fasse tout de suite.
contexte = la personnalité est enregistrée
garder = oui
fixe = oui

[personnalite.retour_neutre]
texte = Retour au ton neutre d'origine.
contexte = la personnalité est désactivée
fixe = oui

[personnalite.inchangee]
texte = Rien de changé.
contexte = entrée seule à l'invite
fixe = oui

[personnalite.en_cours]
texte = Je réécris mes phrases avec Gemini, cela prend une à deux minutes.
contexte = réécriture lancée tout de suite
fixe = oui

[personnalite.faite]
texte = Voilà, je parle autrement : {resume}. {reussies} réécrites, {gardees} gardées telles quelles.
contexte = réécriture terminée
fixe = oui

[personnalite.plus_tard]
texte = D'accord, ce sera cette nuit à minuit.
contexte = la personne ne veut pas la réécriture immédiate
fixe = oui

[personnalite.echec]
texte = Je n'ai pas pu changer de personnalité : {raison}. Je garde mes phrases.
contexte = réécriture impossible
fixe = oui

