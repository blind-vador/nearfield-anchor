[imprimante.net.buse_z_arret]
texte = Arrêt de la montée : la tête devait être à {cible} millimètres, l'imprimante dit {mm}, ou une butée s'est déclenchée. J'ai arrêté les moteurs et rien n'a chauffé. Vérifie la tête avant de recommencer.
