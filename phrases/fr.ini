[imprimante.filament_reprise_echec]
texte = Impossible de forcer la reprise : {detail}. Tu peux aussi appuyer sur le bouton de l'imprimante, ou éteindre et rallumer.

[imprimante.filament_reprise_toujours_pause]
texte = La pause filament continue. Vérifie que le fil est bien enclenché sous le levier de l'extrudeur, jusqu'à la butée. Puis retape filament prêt, ou appuie sur le bouton de l'imprimante.

[imprimante.filament_reprise_partielle]
texte = Pause levée, mais la rechauffe ou la reprise a échoué : {detail}. Vérifie la liaison, puis retape filament prêt.

[imprimante.filament_reprise_capteur]
texte = Pause écran toujours active. Si elle éjecte ou charge, attends la fin. Sinon enfonce le fil, appuie une fois sur le bouton, ou dis filament prêt pour avancer le dialogue. N'annonce "c'est bon" que quand le moteur s'est arrêté et que l'écran n'attend plus.

[imprimante.evt_filament_bouton]
texte = L'imprimante demande d'appuyer sur son bouton pour continuer la chauffe. Fil en place, puis bouton.

[imprimante.evt_filament_ecran_attente]
texte = Écran imprimante : insère le filament puis appuie une fois sur le bouton. Le tic-tic, c'est l'écran qui attend ta validation.

[imprimante.evt_filament_ecran_action]
texte = L'imprimante charge ou éjecte le filament. Attends la fin du moteur. Si elle éjecte juste après avoir chargé, le capteur ne voit pas le fil.

[imprimante.evt_filament_ecran_reattente]
texte = L'écran attend encore. Vérifie que le fil est bien enfoncé jusqu'à la butée, puis appuie une fois sur le bouton. Ou dis filament prêt pour simuler le bouton.

[imprimante.filament_reprise_action]
texte = L'imprimante est en train d'éjecter ou de charger le filament. Attends la fin du mouvement, puis appuie sur le bouton si l'écran le redemande, ou dis filament prêt.

[imprimante.evt_filament_ok]
texte = C'est bon : plus de pause filament. L'imprimante a repris ou peut reprendre.


[imprimante.etat_filament_erreur]
texte = Capteur filament : erreur, l'imprimante est en pause et attend le fil ou le bouton.

[imprimante.etat_filament_ok]
texte = Capteur filament : fil détecté en place.


[imprimante.evt_filament_pause_active]
texte = Pause filament toujours active. Enfonce le fil jusqu'à la butée, appuie sur le bouton de l'imprimante, puis dis filament prêt.

[imprimante.evt_filament_manque]
texte = Attention : l'imprimante a détecté un problème de filament. Elle est en pause et attend. Le fil est peut-être cassé, ou pas assez enfoncé dans l'extrudeur.

[imprimante.evt_filament_guide]
texte = Guide : ouvre le levier de l'extrudeur, enfonce le fil jusqu'à sentir une résistance, referme le levier. Si le fil a cassé court, tape éjecte filament ou F pour le retirer à froid, puis recharge un bout propre. Quand c'est bon, tape filament prêt pour reprendre, ou annule l'impression.

[imprimante.evt_filament_extrusion_longue]
texte = L'imprimante a refusé une extrusion trop longue : souvent le signe que le fil n'avance plus. Même procédure : vérifier l'engagement dans l'extrudeur.

[imprimante.lancement_test_filament_demande]
texte = Test filament fait. As-tu entendu le moteur pousser, et le fil a-t-il bougé ? Dis oui pour continuer, ou non pour arrêter et recharger le fil.

[imprimante.lancement_test_filament_refuse]
texte = D'accord, on n'imprime pas. Enfonce bien le fil dans l'extrudeur jusqu'à la butée, levier fermé. Si besoin : éjecte filament, coupe le bout, réinsère, puis relance l'impression.

[imprimante.filament_pret_ok]
texte = Filament signalé prêt. Reprise demandée à l'imprimante.

[imprimante.filament_pret_pas_en_pause]
texte = Pas de pause filament détectée. Si l'imprimante est bloquée, annule puis relance. Sinon vérifie l'écran ou tape état imprimante.

[commande.filament prêt.description]
texte = après une pause filament : confirmer que le fil est rechargé et demander la reprise

