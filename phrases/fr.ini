contexte = imprimante_nettoyage.py, échec de l'origine

[imprimante.net.buse_z_haut_lance]
texte = Mouvement lancé, ne touche pas l'imprimante. La tête monte tout en haut, par paliers de 2 centimètres, en vérifiant sa position à chaque palier.
