texte = Attention : la sonde signale un état inhabituel. Ce n'est pas forcément la buse contre le plateau. Vérifie que la tête bouge librement, puis redemande l'origine.

[imprimante.origine_probe_hors_plateau]
texte = La sonde serait en dehors du plateau à cet endroit : pas d'origine en hauteur, pour ne pas écraser la buse. Fais d'abord l'origine de X et Y.

[imprimante.origine_mode_probe]
texte = Sonde de plateau détectée. L'origine en hauteur se fait en plusieurs étapes contrôlées.

[imprimante.origine_mode_mesh]
texte = Correction automatique du plateau disponible.

[imprimante.origine_faite_adaptive]
texte = Origine faite pour {axes}. Buse en X {x}, Y {y}, à {z} millimètres de hauteur. La tête n'est pas au milieu : c'est la sonde, décalée à gauche, qui est au-dessus du centre. Réglage du plateau : {mode}.

