[imprimante.net.nom.buse_changer]
texte = démontage ou remontage de la buse, à chaud
contexte = imprimante_nettoyage.py, nom de la méthode

[imprimante.net.resume.buse_changer]
texte = Pour changer la buse, ou la sortir pour la nettoyer. Une buse se desserre et se serre à chaud : le laiton et le bloc de chauffe se dilatent ensemble. À froid, on risque d'arracher le filetage ou de laisser une fuite de plastique. Environ quinze minutes avec la chauffe et le refroidissement.
contexte = imprimante_nettoyage.py, présentation de la méthode

[imprimante.net.mat.gants]
texte = Des gants qui résistent à la chaleur, assez fins pour bien sentir la clé : des gants de soudeur fins, ou des gants de cuisine en silicone.
contexte = matériel au toucher

[imprimante.net.mat.cle_buse]
texte = Une clé plate pour la buse : sur l'Ender 3, une petite clé de 7 millimètres, plate, avec une ouverture en U qui entoure les six pans de la buse. Elle est souvent fournie avec l'imprimante.
contexte = matériel au toucher

[imprimante.net.mat.pince_bloc]
texte = Une clé à molette ou une pince plate, pour tenir le bloc de chauffe : le petit cube de métal où la buse est vissée. Il ne doit pas tourner, sinon ses fils se tordent.
contexte = matériel au toucher

[imprimante.net.buse_q_sens]
texte = Démontage ou remontage de la buse. M pour monter une buse, D pour démonter celle qui est en place.
contexte = imprimante_nettoyage.py, première question
garder = M, D

[imprimante.net.buse_q_tete]
texte = Ta tête d'impression a-t-elle un tube blanc en PTFE qui descend jusqu'à la buse, comme l'Ender 3 d'origine ? P si oui, ou si tu ne sais pas. T si c'est une tête tout métal. Je m'en souviendrai pour la prochaine fois.
contexte = imprimante_nettoyage.py, type de tête (une seule fois)
garder = P, T, PTFE

[imprimante.net.buse_tete_ptfe]
texte = tête avec tube PTFE : je ne dépasse pas 240 degrés, car au-delà le PTFE se dégrade et dégage des fumées toxiques
contexte = imprimante_nettoyage.py, température choisie
garder = PTFE

[imprimante.net.buse_tete_tout_metal]
texte = tête tout métal
contexte = imprimante_nettoyage.py, température choisie

[imprimante.net.buse_annonce_montage]
texte = Remontage d'une buse, à {t} degrés, {tete}.
contexte = imprimante_nettoyage.py, début du remontage

[imprimante.net.buse_annonce_demontage]
texte = Démontage de la buse, à {t} degrés, {tete}.
contexte = imprimante_nettoyage.py, début du démontage

[imprimante.net.buse_prep_montage]
texte = Avant la chauffe, pendant que tout est froid : visse la nouvelle buse à la main dans le bloc de chauffe, par en dessous, dans le sens des aiguilles d'une montre quand tu la regardes d'en dessous. Visse jusqu'à ce qu'elle bute, sans forcer : le serrage final se fera à chaud. Garde la clé plate, la pince et les gants à portée de main.
contexte = imprimante_nettoyage.py, préparation du remontage

[imprimante.net.buse_prep_demontage]
texte = Prépare à portée de main la clé plate, la pince et les gants. Rien à faire sur la buse pour l'instant : elle se dévissera à chaud, dans le sens inverse des aiguilles d'une montre quand tu la regardes d'en dessous.
contexte = imprimante_nettoyage.py, préparation du démontage

[imprimante.net.buse_gants]
texte = La tête est tout en haut et contre le bord droit. Tant que tout est froid, touche le dessous de la tête pour repérer la buse, la petite pointe de laiton, et le bloc de chauffe juste au-dessus. Puis mets les gants. Ensuite, je lance la chauffe.
contexte = imprimante_nettoyage.py, avant la chauffe

[imprimante.net.buse_geste_montage]
texte = Avec les gants, tiens le bloc de chauffe avec la pince ou la clé à molette, pour qu'il ne tourne pas. Mets la clé plate sur les six pans de la buse et serre juste un peu : un huitième de tour, une petite pression ferme, pas plus. Le laiton est tendre, ne force jamais. Ne passe jamais un doigt sous le bloc : il est brûlant. Retire la clé, puis je coupe la chauffe.
contexte = imprimante_nettoyage.py, serrage à chaud

[imprimante.net.buse_geste_demontage]
texte = Avec les gants, tiens le bloc de chauffe avec la pince ou la clé à molette, pour qu'il ne tourne pas. Mets la clé plate sur les six pans de la buse et desserre juste un peu, un huitième de tour, dans le sens inverse des aiguilles d'une montre vu d'en dessous. Ensuite elle tourne plus facilement : continue à la clé, jamais aux doigts, elle est brûlante. Fais-la tomber sur une surface qui ne craint pas la chaleur, ou garde-la dans la clé. Un peu de plastique qui coule, c'est normal. Quand la buse est sortie, je coupe la chauffe.
contexte = imprimante_nettoyage.py, desserrage à chaud

[imprimante.net.buse_origine_lancee]
texte = Mouvement lancé, ne touche pas l'imprimante. Je prends l'origine des trois axes.
contexte = imprimante_nettoyage.py, origine avant de monter la tête

[imprimante.net.buse_origine_faite]
texte = Origine faite.
contexte = imprimante_nettoyage.py

[imprimante.net.buse_origine_ratee]
