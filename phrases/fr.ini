[dmr.explications]
texte = Le DMR est une radio numérique professionnelle. Une fréquence est partagée en deux intervalles de temps, ce qui permet deux conversations à la fois. Le code couleur, de 0 à 15, distingue deux réseaux qui se partagent une même fréquence. Un groupe d'appel est un numéro qui réunit une équipe ou un service : tous ses membres entendent les appels du groupe. L'émetteur est le numéro de la radio qui parle. Un relais est une station fixe qui répète les appels plus loin ; il n'émet que pendant les conversations. Les appels privés, d'un poste à un autre, et les appels chiffrés ne sont jamais écoutés : je n'en note que les numéros.
contexte = dmr_cmd.py, glossaire
fixe = oui

