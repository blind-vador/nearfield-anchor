[imprimante.origine_z_procedure]
texte = Origine en hauteur : d'abord X et Y, puis la sonde se place au-dessus du centre du plateau, je vérifie, et seulement alors la tête descend. Ne coupe pas le courant pendant ce temps.

[imprimante.origine_pas_centre_sonde]
texte = Je n'ai pas pu vérifier que la sonde est au-dessus du centre du plateau : origine en hauteur annulée, pour ne pas écraser la buse. Dis calibrage imprimante pour une mise à l'origine guidée.

[imprimante.procedure_calibrage]
texte = Pour le calibrage guidé, dis calibrage imprimante : vérifications, test des capteurs, origines, réglage du plateau et hauteur de la buse, étape par étape. La sonde est le petit boîtier à tige, à gauche de la buse ; au repos, tige rentrée, elle peut indiquer touchée, c'est normal. La tête finit vers X {sx}, Y {sy} : c'est la sonde qui est au-dessus du centre.

[imprimante.origine_butees_xy]
texte = Les petits chocs sur le fond ou le côté, ce sont les butées X ou Y, c'est voulu. Ce n'est pas la sonde qui martèle le plateau.

[imprimante.cal.titre]
texte = Calibrage de l'imprimante.
contexte = titre du dialogue de calibrage

[imprimante.cal.consigne]
texte = Onze étapes, de la plus prudente à la plus engagée : découverte de la machine au toucher, vérifications, test de la sonde, hauteur de la sonde, sens du moteur, test à l'ongle, mise à l'origine, fidélité de la sonde, réglage des molettes, hauteur de la buse, carte du plateau. Entrée : lancer l'étape. S : passer à la suivante. R : répéter. F1 : aide de l'étape. Échap : quitter. Pendant un mouvement, Espace arrête la tête et la fait remonter.
contexte = consigne du calibrage, à l'ouverture
garder = Entrée, R, S, C, T, F1, Échap, Espace

