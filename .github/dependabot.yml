# Mises a jour proposees chaque semaine (2026-10-23).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels: ["dependances"]
  - package-ecosystem: "pip"
    directory: "/mac"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels: ["dependances", "mac"]
    # Venv d'analyse en Python 3.11 depuis le 2026-11-16 : plus de blocage, sauf
    # numpy (< 2) et packaging (< 24), exiges par DeepFilterNet 0.5.6.
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "packaging"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/pont"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels: ["dependances", "pont"]
  - package-ecosystem: "cargo"
    directory: "/pont/python"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels: ["dependances", "pont"]
