server {
    listen 127.0.0.1:8088;
    server_name _;
    root /media/nas/nd1/server/webserver;
    index index.php index.html;
    location / { try_files $uri $uri/ /index.php; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
